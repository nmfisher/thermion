output: '../lib/src/bindings/src/thermion_dart_ffi.g.dart'
sort: true
headers:
  entry-points:
    - '../native/include/c_api/*.h'
    - '../native/include/c_api/**/*.h'
  include-directives:
    - '../native/include/c_api/*.h'
    - '../native/include/c_api/**/*.h'
ffi-native:
  asset-id: package:thermion_dart/thermion_dart.dart
ignore-source-errors: true
functions:
  leaf:
    include:
      - '.*'
    exclude:
      # FrameScheduler_stop joins the scheduler callback thread. Blocking
      # functions must not be Dart FFI leaf calls. This excludes it only from
      # isLeaf:true, not from the bindings. The multi-client registration calls
      # also take the scheduler lifecycle mutex (and the last removal joins the
      # dispatch thread), so they must not be leaf calls either.
      - 'FrameScheduler_stop'
      - 'FrameScheduler_startWithCallback'
      - 'FrameScheduler_startWithPort'
      - 'FrameScheduler_removePort'
      - 'FrameScheduler_removeCallback'
      - 'FrameScheduler_setTargetFps'
enums:
  as-int:
    include:
      - .*
