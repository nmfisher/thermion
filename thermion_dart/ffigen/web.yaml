output: '../lib/src/bindings/src/thermion_dart_js_interop.g.dart'
sort: true
headers:
  entry-points:
    - '../native/web/include/ThermionWebApi.h'
    - '../native/include/c_api/*.h'
    - '../native/include/c_api/**/*.h'
  include-directives:
    - '../native/web/include/ThermionWebApi.h'
    - '../native/include/c_api/*.h'
    - '../native/include/c_api/**/*.h'
# ffigen_js parses these headers with libclang and the wasm32-unknown-emscripten
# target. The two include paths are relative to the process working directory,
# so run it from thermion_dart/ (as `make dart-bindings` does):
#   - ffigen/emscripten_stub: a parse-only stand-in for the handful of
#     Emscripten/freestanding headers the C API uses (emscripten.h,
#     emscripten/html5_webgl.h, stdint.h, stddef.h, stdbool.h). Without it,
#     libclang silently falls back to the host's glibc headers and every
#     fixed-width type is generated as `int`; with it, regeneration works on
#     any machine, not only in CI with an Emscripten sysroot.
#   - native/include: the c_api headers include each other as "c_api/...".
# A real sysroot can still be supplied with --compiler-opts (the Makefile's
# FFIGEN_JS_COMPILER_OPTS), which overrides these entries.
#
# -DTHERMION_SUPPORTS_WEBGPU mirrors the web build's definition for WebGPU
# engines (native/web/CMakeLists.txt) so the declarations guarded by it in
# ThermionWebApi.h (Thermion_createOffscreenSwapChain and its JobThread
# dispatcher) get bindings. One binding file serves every engine variant:
# the export only exists in WebGPU engines, and the Dart callers guard on
# it (supportsSkipPresent probes the module for the export; a WebGL2 engine
# never reaches the call).
compiler-opts:
  - '-D__EMSCRIPTEN__'
  - '-DTHERMION_SUPPORTS_WEBGPU'
  - '-Iffigen/emscripten_stub'
  - '-Inative/include'
# Fail loudly on a missing include instead of generating a wrong binding file
# (ignore-source-errors would turn an unparseable header into `int` types).
ignore-source-errors: false
structs:
  dependency-only: opaque
  include:
    - 'TCaptureViewRequest'
    - 'TFrameInfo'
    - 'TMipLevel'
unions:
  dependency-only: opaque
  exclude: 
    - '.*'
enums:
  as-int:
    include:
      - .*
