linter:
  rules:
    # Warn about lines longer than 80 characters
    - lines_longer_than_80_chars

analyzer:
  errors:
    # Treat long lines as warnings instead of errors
    lines_longer_than_80_chars: warning
  exclude:
    # Unused in thermion_dart — real Swift bindings live in thermion_flutter.
    # Excluded from publish via .pubignore; also exclude from analysis so
    # the missing objective_c import doesn't fail `dart analyze` on publish.
    - lib/src/swift/**
    # Generated FFI/JS-interop bindings (ffigen output, `make bindings`).
    # Linting generated code is noise (e.g. dozens of unnecessary_cast).
    - lib/src/bindings/src/thermion_dart_ffi.g.dart
    - lib/src/bindings/src/thermion_dart_js_interop.g.dart

formatter:
  page_width: 80
