name: thermion_dart
description: 3D rendering toolkit for Dart.
version: 0.6.0-pre.0
homepage: https://thermion.dev
repository: https://github.com/nmfisher/thermion

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  vector_math: ^2.1.2
  plugin_platform_interface: ^2.0.0
  ffi: ^2.1.2
  code_assets: ^1.0.0
  hooks: ^1.0.0
  native_toolchain_c: ^0.17.6
  archive: ^4.0.0
  web: ^1.0.0
  logging: ^1.2.0
  http: ^1.2.2
  path: ^1.9.0
  crypto: ^3.0.0
  image: ^4.3.0
  ffigen_js: ^0.0.14-pre
  
dev_dependencies:
  ffigen: ^18.1.0
  test: ^1.31.1
  mockito: ^5.0.0
  build_runner: ^2.0.0

# Local testing: turn on the Dawn-backed WebGPU path in the build hook.
# Requires a Filament artifact built with FILAMENT_SUPPORTS_WEBGPU=ON
# staged at .dart_tool/thermion_dart/lib/<version>/<platform>/<mode>/.
hooks:
  user_defines:
    thermion_dart:
      webgpu: true
