name: thermion_dart
description: 3D rendering toolkit for Dart.
version: 0.8.0
homepage: https://thermion.dev
repository: https://github.com/nmfisher/thermion

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  vector_math: ^2.1.2
  plugin_platform_interface: ^2.0.0
  ffi: ^2.1.2
  code_assets: ^1.0.0
  hooks: ^1.0.0
  native_toolchain_c: ^0.17.6
  archive: ^4.0.0
  web: ^1.0.0
  logging: ^1.2.0
  http: ^1.2.2
  path: ^1.9.0
  crypto: ^3.0.0
  image: ^4.3.0
  ffigen_js: ^0.1.3

dev_dependencies:
  ffigen: ^18.1.0
  test: ^1.31.1
  mockito: ^5.0.0
  build_runner: ^2.0.0
  yaml_edit: ^2.2.4

# Material factories exercised by this package's native integration tests.
# Consuming applications select their own helpers in their root pubspec.
#
# Local WebGPU testing: set `backend: webgpu` here and run the webgpu
# tests explicitly. The build hook then defines THERMION_SUPPORTS_WEBGPU,
# links Dawn and downloads the pinned -webgpu Filament artifact (built
# with FILAMENT_SUPPORTS_WEBGPU=ON) into
# .dart_tool/thermion_dart/lib/<version>/<platform>/<mode>/.
# Keep it off otherwise — it swaps the Dawn-linked artifact in for every
# native build of this package.
hooks:
  user_defines:
    thermion_dart:
      materials:
        image: true
        grid: true
        gizmo: true
        translation_axis: true
        bone_overlay: true
        silhouette: true
        edge_outline: true
        wireframe: true
        normal_color: true
        sharp_edge: true
        capture_uv: true
        linear_depth: true
        unlit_fixed_size: true
