name: thermion_material_editor
description: Live GLSL material editor for Thermion on the web — edit material() source, compile with filamat in the browser, apply to a primitive instantly.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  thermion_dart:
    path: ../../../thermion_dart
  logging: ^1.3.0
  web: ^1.0.0

# Pure-web package (compiled to WASM): never needs a host native build.
# skip_native_build keeps `dart run` tooling (e.g. the download script) from
# firing the host CBuilder; the web branch of the build hook still runs and
# downloads the engine artifacts below.
#
# runtime_materials: true makes the build hook fetch the filamat-enabled web
# engine variant (thermion_dart-<sha>-web-runtime-materials.zip) instead of
# the default one — that is what makes compileMaterialSource work here.
hooks:
  user_defines:
    thermion_dart:
      skip_native_build: true
      runtime_materials: true
