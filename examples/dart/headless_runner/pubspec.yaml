name: thermion_headless_runner
description: Headless CLI runner for the Thermion examples. Renders any registered example offscreen and writes a PNG.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  thermion_dart:
    path: ../../../thermion_dart
  thermion_examples_lib:
    path: ../examples_lib

# Mirrors the override in examples_lib (pub only honours overrides from the
# root package): reactphysics3d_dart pins ffigen_js 0.0.5-pre, conflicting
# with thermion_dart's ffigen_js ^0.0.14-pre. This runner is native-only, so
# the web bindings the override affects are never exercised here. Delete
# together with the examples_lib override once reactphysics3d_dart relaxes
# its pin.
dependency_overrides:
  ffigen_js: ^0.0.14-pre
