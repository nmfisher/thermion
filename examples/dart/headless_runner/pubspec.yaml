name: thermion_headless_runner
description: Headless CLI runner for the Thermion examples. Renders any registered example offscreen and writes a PNG.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  thermion_dart:
    path: ../../../thermion_dart
  thermion_examples_lib:
    path: ../examples_lib

# Use Thermion’s ffigen_js version for both sets of generated bindings.
dependency_overrides:
  ffigen_js: ^0.1.3
