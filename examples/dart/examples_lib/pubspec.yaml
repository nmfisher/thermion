name: thermion_examples_lib
description: Shared scene-setup functions for the Thermion Dart examples. Consumed by both the headless CLI runner and the web gallery.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  thermion_dart:
    path: ../../../thermion_dart
  assimp_dart:
    git:
      url: https://github.com/nmfisher/assimp_dart.git
  vector_math: ^2.1.4
  reactphysics3d_dart:
    git:
      url: https://github.com/nmfisher/reactphysics3d_dart.git
      ref: 52eec72e06b322080d395415bc1dfaffd8c45d2f

# TEMPORARY: reactphysics3d_dart (at the ref above) still pins ffigen_js
# 0.0.5-pre, which conflicts with thermion_dart's ffigen_js ^0.0.14-pre, so
# version solving fails without this override. The web path no longer depends
# on it -- ReactPhysics3D is linked into the single thermion_dart WASM (see
# scripts/download_reactphysics3d.sh) -- but the *generated* web bindings in
# reactphysics3d_dart are still 0.0.5-era, so struct field access would throw
# at runtime until that package regenerates them under 0.0.14. When it does:
# bump the git ref above and delete this override (and the mirrors in
# headless_runner/ and web_gallery/).
dependency_overrides:
  ffigen_js: ^0.0.14-pre
