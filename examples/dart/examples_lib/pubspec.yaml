name: thermion_examples_lib
description: Shared scene-setup functions for the Thermion Dart examples. Consumed by both the headless CLI runner and the web gallery.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  thermion_dart:
    path: ../../../thermion_dart
  assimp_dart:
    git:
      url: https://github.com/nmfisher/assimp_dart.git
  vector_math: ^2.1.4
  reactphysics3d_dart:
    git:
      url: https://github.com/nmfisher/reactphysics3d_dart.git
      ref: aaa4d304eae647749f0dc108b76a10d1c2ec0db8

# Use Thermion’s ffigen_js version for both sets of generated bindings.
dependency_overrides:
  ffigen_js: ^0.1.3
