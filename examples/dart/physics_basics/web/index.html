<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thermion — Physics Basics</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; width: 100%; height: 100%; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #controls {
      position: absolute; top: 8px; left: 8px; z-index: 10;
      display: flex; align-items: center; gap: 8px;
    }
    #reset-btn {
      font: 12px ui-monospace, monospace; padding: 5px 10px;
      background: rgba(0, 0, 0, 0.6); color: #eee; border: 1px solid #555;
      border-radius: 4px; cursor: pointer;
    }
    #reset-btn:hover { border-color: #8af; }
    #info {
      position: absolute; bottom: 8px; left: 8px;
      color: #ccc; font: 12px ui-monospace, monospace; pointer-events: none;
      text-shadow: 0 1px 2px #000;
    }
    #loading {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #000; color: #cfd6e0; font: 13px ui-monospace, monospace;
    }
    #loading[hidden] { display: none !important; }
    #loading .spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #6ea8ff;
      animation: thermion-spin 0.8s linear infinite;
    }
    @keyframes thermion-spin { to { transform: rotate(360deg); } }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #f88; font: 14px ui-monospace, monospace; max-width: 80%;
      text-align: center; display: none; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="thermion_canvas"></canvas>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Initializing renderer…</div>
  </div>
  <div id="controls">
    <button id="reset-btn" type="button">Drop again</button>
  </div>
  <div id="info">loading…</div>
  <div id="error"></div>

  <script>
    const canvas = document.getElementById('thermion_canvas');
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  </script>
  <script src="thermion_dart.js"></script>
  <script src="reactphysics3d_dart.js"></script>
  <script type="module">
    try {
      window.thermion_dart = await thermion_dart();
      window.rp3d = await reactphysics3d_dart();
    } catch (err) {
      const el = document.getElementById('error');
      el.textContent = 'Failed to load WASM modules: ' + err +
        '\n\nEnsure thermion_dart.{js,wasm} and reactphysics3d_dart.{js,wasm} are in web/ and serve with COOP/COEP headers.';
      el.style.display = 'block';
      throw err;
    }

    try {
      const { compileStreaming } = await import('./main.mjs');
      const compiledApp = await compileStreaming(fetch('./main.wasm'));
      const app = await compiledApp.instantiate({});
      app.invokeMain();
    } catch (jsErr) {
      const el = document.getElementById('error');
      el.textContent = 'Failed to boot physics_basics: ' + jsErr;
      el.style.display = 'block';
      throw jsErr;
    }
  </script>
</body>
</html>
