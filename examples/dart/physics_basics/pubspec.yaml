name: physics_basics
description: Standalone Thermion + ReactPhysics3D rigid-body physics example (headless native & WASM web).
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  logging: ^1.3.0
  reactphysics3d_dart:
    git:
      url: https://github.com/nmfisher/reactphysics3d_dart.git
      ref: b1da137a1c16d12fa2f8c1eb597539b916687bba
  thermion_dart:
    path: ../../../thermion_dart
  vector_math: ^2.1.4
  web: ^1.0.0

# Use Thermion's ffigen_js version for both sets of generated bindings.
dependency_overrides:
  ffigen_js: ^0.1.3
