name: material_editor
description: "Live Filament material editor: edit .mat source and hot-swap it onto a renderable at runtime."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  vector_math: ^2.1.4
  thermion_flutter: ^0.2.1-dev.7

dependency_overrides:
  thermion_dart:
    path: ../../../thermion_dart
  thermion_flutter:
    path: ../../../thermion_flutter/thermion_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - materials/
