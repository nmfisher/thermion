name: quickstart
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
      
dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  cupertino_icons: ^1.0.8
  vector_math: ^2.1.4
  win32: 5.5.1
  web: 1.0.0
  thermion_flutter: ^0.2.1-dev.7

dependency_overrides:
  thermion_dart:
    path: ../../../thermion_dart
  thermion_flutter:
    path: ../../../thermion_flutter/thermion_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Enables driving this app from an AI code harness via the Dart/Flutter MCP
  # (see README → "Driving via MCP"). Dev-only: not part of the app runtime.
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
