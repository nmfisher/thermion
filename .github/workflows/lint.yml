name: Lint

on:
  pull_request:
  push:
    branches: [ develop, master ]

jobs:
  format-and-analyze:
    name: Format & Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-lint-${{ hashFiles('thermion_dart/pubspec.yaml') }}
          restore-keys: pub-lint-

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            thermion_dart/lib \
            thermion_dart/bin \
            thermion_dart/hook \
            thermion_dart/tool \
            thermion_dart/test \
            thermion_flutter/thermion_flutter/lib

      - name: Get deps (thermion_dart)
        working-directory: thermion_dart
        run: dart pub get

      - name: Analyze (thermion_dart)
        working-directory: thermion_dart
        run: dart analyze
