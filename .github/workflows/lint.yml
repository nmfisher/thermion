name: Lint

on:
  pull_request:
  push:
    branches: [ develop, master ]

jobs:
  format-and-analyze:
    name: Format & Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-lint-${{ hashFiles('thermion_dart/pubspec.yaml') }}
          restore-keys: pub-lint-

      # Formatting is enforced and auto-fixed by format.yml; this job only
      # checks analyze. Don't re-add a --set-exit-if-changed gate here or it
      # will double-gate against the pre-format commit on PRs.
      - name: Get deps (thermion_dart)
        working-directory: thermion_dart
        run: dart pub get

      - name: Analyze (thermion_dart)
        working-directory: thermion_dart
        run: dart analyze
