name: Regenerate Materials

# Regenerates every committed material artifact whenever filament.version
# changes, using the matc/resgen pair from the version-matched Filament
# release tarball.
#
# Why: Filament panics at runtime when a committed .filamat was compiled by
# an older matc than the linked libs (utils::PostconditionPanic "Material
# version mismatch", see ticket the-33h6). The rule is simple: ALWAYS
# regenerate when filament.version changes. The paths filter enforces it -
# the workflow fires only on pushes/PRs that touch filament.version, and is
# a fast no-op (never starts) otherwise. matc output for a fixed version is
# deterministic, so if the tree is already up to date the job produces no
# diff and no commit.
#
# develop is excluded: generate-artifacts.yml regenerates and commits
# materials there (its materials-changed filter also covers filament.version),
# keeping a single pusher per branch. This workflow covers every other
# branch, including PR heads.
#
# Auto-commits use GITHUB_TOKEN on purpose: GitHub suppresses workflows
# triggered by GITHUB_TOKEN pushes, so the regeneration commit cannot
# re-fire this workflow (or any other) in a loop.
on:
  push:
    branches:
      - '**'
      - '!develop'
    paths:
      - 'filament.version'
  pull_request:
    branches-ignore:
      - develop
    paths:
      - 'filament.version'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-materials-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-materials:
    name: Regenerate materials
    runs-on: ubuntu-24.04
    steps:
      # On PRs, check out the head branch (not the merge ref) so a
      # regeneration commit lands on the branch itself.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Cache Filament build tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/thermion/filament-tools
          key: filament-tools-${{ runner.os }}-${{ hashFiles('filament.version') }}

      - name: Regenerate materials with pinned matc
        run: scripts/regenerate-materials.sh

      - name: Check for changes
        id: git-check
        # --porcelain also catches newly generated (untracked) files; the
        # gitignored materials/*.filamat intermediates don't appear in it.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push regenerated materials
        # Fork PRs cannot be pushed to with GITHUB_TOKEN - report instead.
        if: ${{ steps.git-check.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          PUSH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A thermion_dart/native/include/material examples/assets
          git commit -m "chore: regenerate materials for filament.version (CI)

          Regenerated by the Regenerate Materials workflow so the committed
          materials always match the Filament version in filament.version.

          🤖 Generated with GitHub Actions"
          # Rebase on a clean tree in case a concurrent push landed.
          git pull --rebase origin "$PUSH_BRANCH"
          git push origin "HEAD:$PUSH_BRANCH"

      - name: Report unpushable regeneration (fork PR)
        if: ${{ steps.git-check.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Materials changed but this PR comes from a fork, so the regeneration cannot be pushed to the branch. Run scripts/regenerate-materials.sh locally and push."
          git --no-pager diff --stat
          exit 1
