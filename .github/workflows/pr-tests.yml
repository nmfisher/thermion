# Runs the full Dart/Flutter test suite on every pull request, gated behind
# manual approval. GitHub Actions does not allow `environment` on a job that
# calls a reusable workflow (run-tests.yml), so the gate is a separate no-op
# job: `approval-gate` references the `pr-approval` environment, whose
# required-reviewer rule holds the run in "Waiting" state until it is
# approved from the PR's Checks tab (Review deployments -> Approve and run).
# The suite itself lives in run-tests.yml (workflow_call), which fans out to
# run-dart-tests.yml and run-flutter-builds.yml, and only starts after the
# gate job is approved.
#
# Matrix jobs expand into many check run names ("Dart Tests (Linux)", ...),
# which is awkward to reference from branch protection. The tests-passed job
# folds the whole suite into a single stable check name ("PR tests passed")
# that the required status checks on develop/main reference.
name: PR Tests (Dart/Flutter)

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  # compare-dart-test-output downloads baseline artifacts from a previous run
  # (actions/download-artifact@v4 with an explicit run-id), which requires
  # actions:read on the token.
  actions: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval-gate:
    name: Approval gate (pr-approval)
    runs-on: ubuntu-latest
    environment: pr-approval
    steps:
      - name: Await approval
        run: echo "Approved; starting PR test suite."

  tests:
    name: Dart/Flutter tests
    needs: [approval-gate]
    uses: ./.github/workflows/run-tests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  tests-passed:
    name: PR tests passed
    needs: [tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate suite result
        run: |
          result="${{ needs.tests.result }}"
          if [ "$result" != "success" ]; then
            echo "PR test suite did not pass (result: $result)."
            exit 1
          fi
          echo "PR test suite passed."
