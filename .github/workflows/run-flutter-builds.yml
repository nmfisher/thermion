name: Flutter Example Builds

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

jobs:
  flutter-examples:
    name: Flutter Examples (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            flutter-channel: stable
            flutter-arch: ARM64
          - name: Windows
            os: windows-latest
            flutter-channel: stable
            flutter-arch: X64
          - name: Linux
            os: ubuntu-22.04
            flutter-channel: stable
            flutter-arch: X64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: ${{ matrix.flutter-channel }}
          architecture: ${{ matrix.flutter-arch }}

      # The plugin's CMake configure runs BEFORE the in-build hook step that
      # extracts the Filament headers from the R2 artifact and writes
      # .dart_tool/generated_headers.cmake (DART_PKG_HEADERS). On a fresh
      # checkout the first `flutter build windows/linux` therefore configures
      # with an empty DART_PKG_HEADERS and the plugin compile fails on
      # bluevk/BlueVK.h. Running the plugin unit tests first fires the build
      # hooks out of band, so the header dir and generated_headers.cmake
      # already exist when cmake configures.
      - name: Run thermion_flutter unit tests (macOS)
        if: matrix.name == 'macOS'
        working-directory: thermion_flutter/thermion_flutter
        run: |
          flutter pub get
          flutter test

      - name: Run thermion_flutter unit tests (Windows)
        if: matrix.name == 'Windows'
        working-directory: thermion_flutter/thermion_flutter
        run: |
          flutter pub get
          flutter test

      # macOS: build native macOS + Android + web
      - name: Set up JDK 17
        if: matrix.name == 'macOS'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        if: matrix.name == 'macOS'
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cmake-version: 3.22.1
          ndk-version: 25.1.893739

      - name: Accept Android SDK licenses
        if: matrix.name == 'macOS'
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build quickstart (macOS)
        if: matrix.name == 'macOS'
        run: cd quickstart && flutter pub get && flutter build macos

      - name: Build picking (macOS)
        if: matrix.name == 'macOS'
        run: cd picking && flutter pub get && flutter build macos

      - name: Build viewer (macOS)
        if: matrix.name == 'macOS'
        run: cd viewer && flutter pub get && flutter build macos

      # Runs the thermion_flutter lifecycle integration test (FrameScheduler
      # stop/start/pause/resume + WidgetsBindingObserver recovery) against the
      # real macOS target. Validates the Flutter-layer scheduler state machine;
      # the Linux startFlutterSynced resume re-arm is NOT covered here (needs
      # a Linux + display-server runner).
      - name: Run lifecycle integration test (macOS)
        if: matrix.name == 'macOS'
        run: cd quickstart && flutter test integration_test/lifecycle_test.dart -d macos

      - name: Build quickstart (appbundle)
        if: matrix.name == 'macOS'
        run: cd quickstart && flutter build appbundle

      - name: Build picking (appbundle)
        if: matrix.name == 'macOS'
        run: cd picking && flutter build appbundle

      - name: Build viewer (appbundle)
        if: matrix.name == 'macOS'
        run: cd viewer && flutter build appbundle

      # Windows: build native Windows
      - name: Build quickstart (Windows)
        if: matrix.name == 'Windows'
        run: cd quickstart && flutter pub get && flutter build windows

      - name: Build picking (Windows)
        if: matrix.name == 'Windows'
        run: cd picking && flutter pub get && flutter build windows

      # Linux: install deps, build native Linux + web
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libdrm-dev libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      # Same priming as the Windows/macOS unit test steps above: fires the
      # build hooks so the Filament headers are extracted and
      # generated_headers.cmake exists before cmake configures. Must run
      # after the toolchain deps above are installed.
      - name: Run thermion_flutter unit tests (Linux)
        if: matrix.name == 'Linux'
        working-directory: thermion_flutter/thermion_flutter
        shell: bash
        run: |
          flutter pub get
          flutter test

      - name: Build quickstart (Linux)
        if: matrix.name == 'Linux'
        run: cd quickstart && flutter pub get && flutter build linux

      - name: Build picking (Linux)
        if: matrix.name == 'Linux'
        run: cd picking && flutter pub get && flutter build linux

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-flutter-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5
