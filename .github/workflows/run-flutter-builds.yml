name: Flutter Example Builds

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

jobs:
  flutter-examples:
    name: Flutter Examples (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            flutter-channel: stable
            flutter-arch: ARM64
          - name: Windows
            os: windows-latest
            flutter-channel: stable
            flutter-arch: X64
          - name: Linux
            os: ubuntu-22.04
            flutter-channel: stable
            flutter-arch: X64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: ${{ matrix.flutter-channel }}
          architecture: ${{ matrix.flutter-arch }}
          cache: true
          pub-cache: true

      # The plugin's CMake configure runs BEFORE the in-build hook step that
      # extracts the Filament headers from the R2 artifact and writes
      # .dart_tool/generated_headers.cmake (DART_PKG_HEADERS). On a fresh
      # checkout the first `flutter build windows/linux` therefore configures
      # with an empty DART_PKG_HEADERS and the plugin compile fails on
      # bluevk/BlueVK.h. Running the plugin unit tests first fires the build
      # hooks out of band, so the header dir and generated_headers.cmake
      # already exist when cmake configures.
      - name: Run thermion_flutter unit tests (macOS)
        if: matrix.name == 'macOS'
        working-directory: thermion_flutter/thermion_flutter
        run: |
          flutter pub get
          flutter test

      - name: Run thermion_flutter unit tests (Windows)
        if: matrix.name == 'Windows'
        working-directory: thermion_flutter/thermion_flutter
        run: |
          flutter pub get
          flutter test

      # macOS: build native macOS examples and run the lifecycle test.
      - name: Build quickstart (macOS)
        if: matrix.name == 'macOS'
        run: cd quickstart && flutter pub get && flutter build macos

      - name: Build picking (macOS)
        if: matrix.name == 'macOS'
        run: cd picking && flutter pub get && flutter build macos

      - name: Build viewer (macOS)
        if: matrix.name == 'macOS'
        run: cd viewer && flutter pub get && flutter build macos

      # Runs the thermion_flutter lifecycle integration test (FrameScheduler
      # stop/start/pause/resume + WidgetsBindingObserver recovery) against the
      # real macOS target. Validates the Flutter-layer scheduler state machine;
      # the Linux startFlutterSynced resume re-arm is NOT covered here (needs
      # a Linux + display-server runner).
      - name: Run lifecycle integration test (macOS)
        if: matrix.name == 'macOS'
        run: cd quickstart && flutter test integration_test/lifecycle_test.dart -d macos

      # Windows: build native Windows
      - name: Build quickstart (Windows)
        if: matrix.name == 'Windows'
        run: cd quickstart && flutter pub get && flutter build windows

      - name: Build picking (Windows)
        if: matrix.name == 'Windows'
        run: cd picking && flutter pub get && flutter build windows

      # Linux: install deps, build native Linux + web
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libdrm-dev libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      # Same priming as the Windows/macOS unit test steps above: fires the
      # build hooks so the Filament headers are extracted and
      # generated_headers.cmake exists before cmake configures. Must run
      # after the toolchain deps above are installed.
      - name: Run thermion_flutter unit tests (Linux)
        if: matrix.name == 'Linux'
        working-directory: thermion_flutter/thermion_flutter
        shell: bash
        run: |
          flutter pub get
          flutter test

      # The checked-in example overrides are relative monorepo paths. Real
      # consumers of a Git or hosted package receive absolute file:/// root
      # URIs in package_config.json, so exercise that resolution path too.
      - name: Exercise absolute package URIs (Linux)
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          sed -i "s|path: ../../../thermion_dart|path: ${GITHUB_WORKSPACE}/thermion_dart|" quickstart/pubspec.yaml
          sed -i "s|path: ../../../thermion_dart|path: ${GITHUB_WORKSPACE}/thermion_dart|" picking/pubspec.yaml

      - name: Build quickstart (Linux)
        if: matrix.name == 'Linux'
        run: cd quickstart && flutter pub get && flutter build linux

      - name: Build picking (Linux)
        if: matrix.name == 'Linux'
        run: cd picking && flutter pub get && flutter build linux

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-flutter-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  android-examples:
    name: Android (${{ matrix.app }}, ${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - app: quickstart
            variant: default
          - app: picking
            variant: default
          - app: viewer
            variant: default
          - app: quickstart
            variant: vulkan
    defaults:
      run:
        working-directory: examples/flutter/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          architecture: X64
          cache: true
          pub-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools cmake;3.22.1 ndk;28.2.13676358'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # materials.backends e2e for Android: build quickstart with the
      # vulkan-only material variant selected via user_defines. Strip any
      # existing hooks block first so this define applies to exactly this job.
      - name: Configure Vulkan-only materials
        if: matrix.variant == 'vulkan'
        shell: bash
        run: |
          awk '
            /^hooks:/ { skip=1; next }
            skip && /^[^[:space:]#]/ { skip=0 }
            !skip { print }
          ' pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          printf '\nhooks:\n  user_defines:\n    thermion_dart:\n      materials:\n        backends:\n          android: vulkan\n' >> pubspec.yaml

      - name: Build app bundle
        run: flutter build appbundle

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-flutter-android-${{ matrix.app }}-${{ matrix.variant }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5
