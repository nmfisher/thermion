name: Runtime material diagnostic tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'thermion_dart/native/**/TMaterialCompiler.*'
      - 'thermion_dart/lib/src/filament/src/implementation/ffi_filament_app.dart'
      - 'thermion_dart/test/runtime_material_diagnostics_test.dart'
      - '.github/workflows/runtime-material-diagnostics-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'thermion_dart/native/**/TMaterialCompiler.*'
      - 'thermion_dart/lib/src/filament/src/implementation/ffi_filament_app.dart'
      - 'thermion_dart/test/runtime_material_diagnostics_test.dart'
      - '.github/workflows/runtime-material-diagnostics-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Enable runtime compiler
        run: |
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                mode: release
                runtime_materials: true
          EOF
      - name: Check runtime compilation and returned diagnostics
        working-directory: thermion_dart
        run: |
          dart pub get
          dart test -j1 test/runtime_material_test.dart test/runtime_material_diagnostics_test.dart --reporter expanded

  web:
    name: Returned compiler diagnostics (web, ${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: worker, variant: '', suffix: '-runtime-materials' }
          - { name: main-thread, variant: main_thread, suffix: '-main-thread-runtime-materials' }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Select compiler-enabled web engine
        run: |
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                skip_native_build: true
                runtime_materials: true
                web_variant: '${{ matrix.variant }}'
          EOF
      - name: Download matching published engine
        working-directory: thermion_dart
        env:
          ENGINE_SUFFIX: ${{ matrix.suffix }}
        run: |
          version="$(cat native/web/web.version)"
          curl -fL "https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev/thermion_dart-${version}-web${ENGINE_SUFFIX}.zip" \
            -o "$RUNNER_TEMP/runtime-material-diagnostics-web.zip"
          unzip -o "$RUNNER_TEMP/runtime-material-diagnostics-web.zip" -d test
      - name: Configure Chrome software rendering
        run: |
          chrome="$(command -v google-chrome)"
          printf '#!/bin/sh\nexec "%s" --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader "$@"\n' \
            "$chrome" > "$RUNNER_TEMP/thermion-test-chrome"
          chmod +x "$RUNNER_TEMP/thermion-test-chrome"
          echo "CHROME_EXECUTABLE=$RUNNER_TEMP/thermion-test-chrome" >> "$GITHUB_ENV"
      - name: Check returned diagnostics and result ownership in browser
        working-directory: thermion_dart
        run: |
          dart pub get
          xvfb-run dart run tool/web_test_runner.dart --assets=../examples/assets --clean \
            test/runtime_material_diagnostics_test.dart
