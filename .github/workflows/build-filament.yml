name: Build Filament

on:
  workflow_dispatch:
    inputs:
      filament_repo:
        description: 'Filament repository as owner/repo (overrides filament.version file)'
        required: false
        type: string
      filament_version:
        description: 'Filament version/tag/branch to build (overrides filament.version file)'
        required: false
        type: string
      platform:
        description: 'Platform(s) to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - ios
          - android
          - linux
          - windows
          - web
      clean_build:
        description: 'Clean build (remove existing artifacts)'
        required: false
        default: true
        type: boolean
      upload_to_r2:
        description: 'Publish content-addressed Filament archives and the versioned WebGPU engine when built. Update the Filament pin with publish-filament-to-r2.yml.'
        required: false
        default: true
        type: boolean
      webgpu:
        description: 'Build Filament with FILAMENT_SUPPORTS_WEBGPU=ON (macOS and Linux)'
        required: false
        default: false
        type: boolean
      webgpu_filament_run:
        description: 'Reuse the WebGPU Filament release archive from this Build Filament run ID (platform=web)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  R2_BUCKET_NAME: thermion
  R2_ENDPOINT: https://260d4efc65af500536ea376de6452ece.r2.cloudflarestorage.com
  R2_PUBLIC_URL: https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      filament_version: ${{ steps.read-version.outputs.version }}
      filament_repo: ${{ steps.read-version.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Check public Filament version
        run: python3 scripts/generate-filament-version.py --check

      - name: Read Filament version
        id: read-version
        run: |
          if [ -n "${{ inputs.filament_version }}" ] && [ -n "${{ inputs.filament_repo }}" ]; then
            REPO="${{ inputs.filament_repo }}"
            VERSION="${{ inputs.filament_version }}"
          else
            read -r REPO VERSION < filament.version
          fi
          # Override individually if provided
          [ -n "${{ inputs.filament_repo }}" ] && REPO="${{ inputs.filament_repo }}"
          [ -n "${{ inputs.filament_version }}" ] && VERSION="${{ inputs.filament_version }}"
          # Resolve VERSION=latest to the newest v*.* tag on the chosen repo.
          # The per-platform jobs do `git clone --branch $VERSION` so we must
          # produce a concrete tag here, not the literal string "latest".
          if [ "$VERSION" = "latest" ]; then
            echo "Resolving latest tag on $REPO..."
            VERSION=$(git ls-remote --tags --refs --sort=-version:refname \
              "$REPO" 'v*' \
              | awk -F/ '{print $NF}' \
              | head -1)
            if [ -z "$VERSION" ]; then
              echo "Error: could not resolve latest tag on $REPO"
              exit 1
            fi
            echo "Resolved latest -> $VERSION"
          fi
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Filament repo: $REPO ref: $VERSION"

      - name: Determine build matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.platform }}" = "all" ]; then
            MATRIX='["macos", "ios", "android", "linux", "windows", "web"]'
          else
            MATRIX='["${{ inputs.platform }}"]'
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Building platforms: $MATRIX"

  build-macos:
    name: Build macOS
    # Xcode 16 (Clang 16+) is required for Dawn's use of C++20 parenthesized
    # aggregate initialization (P0960). macos-14 ships Xcode 15.4 / Clang 15,
    # which lacks P0960 and fails compiling third_party/dawn/src/dawn/platform.
    runs-on: macos-15
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'macos')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Test host-tool verification before building
        run: python3 -m unittest discover -s scripts -p 'test_verify_material_host_tools.py' -v

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Compute zip suffix
        run: |
          if [ "${{ inputs.webgpu }}" = "true" ]; then
            echo "ZIP_SUFFIX=-webgpu" >> $GITHUB_ENV
          else
            echo "ZIP_SUFFIX=" >> $GITHUB_ENV
          fi

      - name: Free disk space
        # The WebGPU build zips huge Dawn debug artifacts and ran out of disk
        # (zip I/O error - No space left on device). jlumbroso/free-disk-space
        # is Ubuntu-only, so delete the large preinstalled toolchains this
        # build does not need: extra Xcode versions (keep the selected one),
        # Android SDK/NDK, simulator runtimes, dotnet and ghcup.
        run: |
          df -h / | tail -1
          SELECTED_XCODE=$(basename "$(dirname "$(dirname "$(xcode-select -p)")")")
          echo "Keeping $SELECTED_XCODE"
          for xcode in /Applications/Xcode*.app; do
            if [ "$(basename "$xcode")" != "$SELECTED_XCODE" ]; then
              echo "Removing $xcode"
              sudo rm -rf "$xcode"
            fi
          done
          sudo rm -rf /usr/local/lib/android /Users/runner/Library/Android
          sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/Library/Developer/CoreSimulator
          sudo rm -rf /usr/local/share/dotnet /usr/local/.ghcup /usr/local/share/boost
          df -h / | tail -1

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_macos.sh
          EXTRA_FLAGS=""
          if [ "${{ inputs.webgpu }}" = "true" ]; then
            EXTRA_FLAGS="--webgpu"
          fi
          scripts/build_macos.sh filament ${{ env.FILAMENT_VERSION }} output --clean $EXTRA_FLAGS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-macos-release${{ env.ZIP_SUFFIX }}
          path: output/filament-${{ env.FILAMENT_VERSION }}-macos-release${{ env.ZIP_SUFFIX }}.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-macos-debug${{ env.ZIP_SUFFIX }}
          path: output/filament-${{ env.FILAMENT_VERSION }}-macos-debug${{ env.ZIP_SUFFIX }}.zip
          retention-days: 7

      - name: Verify packaged universal matc and resgen
        run: |
          python3 scripts/verify-material-host-tools.py \
            output/filament-${{ env.FILAMENT_VERSION }}-macos-release${{ env.ZIP_SUFFIX }}.zip \
            output/filament-${{ env.FILAMENT_VERSION }}-macos-debug${{ env.ZIP_SUFFIX }}.zip

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          pip3 install --break-system-packages awscli
          for variant in release debug; do
            # Content-addressed keys for every artifact, including the
            # -webgpu suffixed zips (record them into the pin via
            # publish-filament-to-r2.yml, same as the canonical ones).
            bash scripts/upload_filament_hashed.sh \
              "output/filament-${{ env.FILAMENT_VERSION }}-macos-${variant}${{ env.ZIP_SUFFIX }}.zip"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-ios:
    name: Build iOS
    # macos-14 is retired ('macos-14-arm64-us-default is not supported' —
    # job cancelled at allocation). macos-15 = same arm64 pool the macOS job
    # builds on successfully.
    runs-on: macos-15
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'ios')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build Filament (device)
        run: |
          mkdir -p output
          chmod +x scripts/build_ios.sh
          scripts/build_ios.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Build Filament (arm64 simulator)
        run: |
          chmod +x scripts/build_ios_simulator.sh
          scripts/build_ios_simulator.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-debug.zip
          retention-days: 7

      - name: Upload simulator release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-simulator-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-simulator-release.zip
          retention-days: 7

      - name: Upload simulator debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-simulator-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-simulator-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          pip3 install --break-system-packages awscli
          for platform in ios ios-simulator; do
            for variant in release debug; do
              bash scripts/upload_filament_hashed.sh \
                "output/filament-${{ env.FILAMENT_VERSION }}-${platform}-${variant}.zip"
            done
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'android')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Install dependencies
        run: |
          set -euo pipefail
          # apt can stall for hours on runner-network DNS blackholes
          # (azure.archive.ubuntu.com); cap each command and retry the batch.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i/3 failed: $*" >&2; sleep 20; done; return 1; }
          retry sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          retry sudo apt-get install -y -o Acquire::http::Timeout=30 clang libc++-dev libc++abi-dev ninja-build libxcb1-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_android.sh
          scripts/build_android.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-android-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-android-debug.zip
          retention-days: 7

      - name: Upload full out directory
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-out
          path: filament/out/
          retention-days: 3

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          for variant in release debug; do
            bash scripts/upload_filament_hashed.sh \
              "output/filament-${{ env.FILAMENT_VERSION }}-android-${variant}.zip"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-linux:
    name: Build Linux
    # ubuntu-22.04 (glibc 2.35) is deliberate — it is the oldest glibc we
    # support, matching the ubuntu-22.04 Dart Tests runner. Building on
    # ubuntu-24.04 (glibc 2.39) made the static archives reference
    # __isoc23_*@GLIBC_2.38 (ISO C23 strtol/strtoul/sscanf redirects emitted
    # by glibc >= 2.38 headers), which dlopen cannot resolve on older
    # distros ("undefined symbol: __isoc23_strtol"). glibc's redirect has no
    # compile-time opt-out, so the only fix is older headers at build time.
    # Filament needs clang/libc++ >= 17 and jammy's distro clang is 14, so
    # the install step below adds clang-18 from apt.llvm.org — the same major
    # version ubuntu-24.04 shipped, keeping the toolchain identical while
    # dropping only the glibc baseline.
    runs-on: ubuntu-22.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'linux')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup CMake
        # jammy ships CMake 3.22; pin the same 3.30 the Windows job uses so
        # the only variable changing vs the previous ubuntu-24.04 build is
        # the glibc headers.
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.0'

      - name: Install dependencies
        run: |
          set -euo pipefail
          # apt can stall for hours on runner-network DNS blackholes
          # (azure.archive.ubuntu.com); cap each command and retry the batch.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i/3 failed: $*" >&2; sleep 20; done; return 1; }
          retry sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          # Base X11 + Mesa for Filament's own OpenGL/Vulkan paths.
          # The libxcb-* set is for Dawn's X11/XCB backend (DAWN_USE_X11)
          # — Dawn pulls in dri3, present, randr, sync, shape, xfixes,
          # shm-fence and friends. Adding them all up front to avoid the
          # one-at-a-time CI ping-pong.
          retry sudo apt-get install -y -o Acquire::http::Timeout=30 \
            ca-certificates wget ninja-build \
            libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxxf86vm-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-image0-dev libxcb-render0-dev \
            libxcb-keysyms1-dev libxcb-util-dev libxcb-xkb-dev \
            libxshmfence-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgbm-dev
          # clang-18 + libc++ 18 from apt.llvm.org (jammy's distro clang is
          # 14, too old for Filament). See the runs-on comment above.
          retry wget -q --tries=3 --timeout=30 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          retry sudo apt-get install -y -o Acquire::http::Timeout=30 libc++-18-dev libc++abi-18-dev
          # build_linux.sh hardcodes CC=clang/CXX=clang++ and apt.llvm.org
          # only installs versioned binaries, so point the unversioned names
          # at clang-18.
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 200
          clang --version

      - name: Compute zip suffix
        run: |
          if [ "${{ inputs.webgpu }}" = "true" ]; then
            echo "ZIP_SUFFIX=-webgpu" >> $GITHUB_ENV
          else
            echo "ZIP_SUFFIX=" >> $GITHUB_ENV
          fi

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_linux.sh
          EXTRA_FLAGS=""
          if [ "${{ inputs.webgpu }}" = "true" ]; then
            EXTRA_FLAGS="--webgpu"
          fi
          scripts/build_linux.sh filament ${{ env.FILAMENT_VERSION }} output --clean $EXTRA_FLAGS

      - name: Reject glibc symbol references newer than 2.35
        # Guards the glibc baseline described in the runs-on comment above:
        # a static archive compiled against glibc >= 2.38 headers references
        # __isoc23_*@GLIBC_2.38 and dlopen fails on older distros. Fail the
        # build here instead of uploading a broken artifact to R2.
        run: |
          set -euo pipefail
          rm -rf check && mkdir check && cd check
          for z in ../output/filament-*.zip; do
            # Each zip gets its own subdir: the release and debug zips
            # contain same-named archives, and extracting both into one
            # directory makes unzip prompt "replace X?" interactively —
            # a runner has no stdin, so unzip dies on EOF before nm ever
            # runs. Separate dirs also keep nm's output attributed to
            # the zip the bad archive came from.
            d="$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q "$z" -d "$d"
          done
          # Archive members reference these without a version suffix (nm shows
          # plain "U __isoc23_strtol"), so match on names: the ISO C23
          # strtol/strtoul/sscanf family glibc >= 2.38 renamed to __isoc23_*,
          # plus any explicitly versioned ref newer than GLIBC_2.35.
          refs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep -E ' U (__isoc23_|.*@GLIBC_2\.(3[6-9]|[4-9][0-9]))' || true)
          if [ -n "$refs" ]; then
            echo "Archives reference glibc symbols newer than GLIBC_2.35;"
            echo "they would fail to dlopen on ubuntu-22.04 (glibc 2.35):"
            echo "$refs"
            exit 1
          fi
          echo "OK: no glibc symbol references newer than GLIBC_2.35"

          # Single C++ ABI: every archive in the zip must be libc++-clean.
          # libthermion_dart.so links all of them with -stdlib=libc++, so a
          # libstdc++-built archive (undefined _ZNSt7__cxx11... std::string
          # refs) pulls a second C++ runtime into the process; the two
          # runtimes' exception/unwind machinery then conflict and crash at
          # runtime. Reject here instead of shipping the broken artifact to
          # R2. (Historical note: this guard was introduced when a
          # libstdc++-built libassimp crashed CI's Linux x64 FBX round-trip
          # test; libassimp no longer ships in these zips — it moved to the
          # assimp_dart repository — but the check still guards the Filament
          # archives this package links.)
          cpprefs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep ' U _ZNSt7__cxx11' || true)
          if [ -n "$cpprefs" ]; then
            echo "Archives reference the libstdc++ ABI (_ZNSt7__cxx11); they must be built with -stdlib=libc++ (see scripts/build_linux.sh):"
            echo "$cpprefs" | head -20
            exit 1
          fi
          echo "OK: no libstdc++-ABI references (single libc++ ABI)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-release${{ env.ZIP_SUFFIX }}
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-release${{ env.ZIP_SUFFIX }}.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-debug${{ env.ZIP_SUFFIX }}
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-debug${{ env.ZIP_SUFFIX }}.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          for variant in release debug; do
            # Content-addressed keys for every artifact, including the
            # -webgpu suffixed zips (record them into the pin via
            # publish-filament-to-r2.yml, same as the canonical ones).
            bash scripts/upload_filament_hashed.sh \
              "output/filament-${{ env.FILAMENT_VERSION }}-linux-${variant}${{ env.ZIP_SUFFIX }}.zip"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-linux-arm64:
    name: Build Linux (arm64)
    # GitHub-hosted arm64 runner — build_linux.sh detects the host arch and
    # produces filament-<version>-linux-arm64-{release,debug}.zip.
    # ubuntu-22.04-arm for the same glibc 2.35 baseline as build-linux above.
    runs-on: ubuntu-22.04-arm
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'linux')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup CMake
        # jammy ships CMake 3.22; pin the same 3.30 the Windows job uses so
        # the only variable changing vs the previous ubuntu-24.04 build is
        # the glibc headers.
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.0'

      - name: Install dependencies
        run: |
          set -euo pipefail
          # apt can stall for hours on runner-network DNS blackholes
          # (azure.archive.ubuntu.com); cap each command and retry the batch.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i/3 failed: $*" >&2; sleep 20; done; return 1; }
          retry sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          retry sudo apt-get install -y -o Acquire::http::Timeout=30 \
            ca-certificates wget ninja-build \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev \
            libgbm-dev
          # clang-18 + libc++ 18 from apt.llvm.org (jammy's distro clang is
          # 14, too old for Filament). See the runs-on comment above.
          retry wget -q --tries=3 --timeout=30 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          retry sudo apt-get install -y -o Acquire::http::Timeout=30 libc++-18-dev libc++abi-18-dev
          # build_linux.sh hardcodes CC=clang/CXX=clang++ and apt.llvm.org
          # only installs versioned binaries, so point the unversioned names
          # at clang-18.
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 200
          clang --version

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_linux.sh
          scripts/build_linux.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Reject glibc symbol references newer than 2.35
        # Guards the glibc baseline described in the runs-on comment above:
        # a static archive compiled against glibc >= 2.38 headers references
        # __isoc23_*@GLIBC_2.38 and dlopen fails on older distros. Fail the
        # build here instead of uploading a broken artifact to R2.
        run: |
          set -euo pipefail
          rm -rf check && mkdir check && cd check
          for z in ../output/filament-*.zip; do
            # Each zip gets its own subdir: the release and debug zips
            # contain same-named archives, and extracting both into one
            # directory makes unzip prompt "replace X?" interactively —
            # a runner has no stdin, so unzip dies on EOF before nm ever
            # runs. Separate dirs also keep nm's output attributed to
            # the zip the bad archive came from.
            d="$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q "$z" -d "$d"
          done
          # Archive members reference these without a version suffix (nm shows
          # plain "U __isoc23_strtol"), so match on names: the ISO C23
          # strtol/strtoul/sscanf family glibc >= 2.38 renamed to __isoc23_*,
          # plus any explicitly versioned ref newer than GLIBC_2.35.
          refs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep -E ' U (__isoc23_|.*@GLIBC_2\.(3[6-9]|[4-9][0-9]))' || true)
          if [ -n "$refs" ]; then
            echo "Archives reference glibc symbols newer than GLIBC_2.35;"
            echo "they would fail to dlopen on ubuntu-22.04 (glibc 2.35):"
            echo "$refs"
            exit 1
          fi
          echo "OK: no glibc symbol references newer than GLIBC_2.35"

          # Single C++ ABI: every archive in the zip must be libc++-clean.
          # libthermion_dart.so links all of them with -stdlib=libc++, so a
          # libstdc++-built archive (undefined _ZNSt7__cxx11... std::string
          # refs) pulls a second C++ runtime into the process; the two
          # runtimes' exception/unwind machinery then conflict and crash at
          # runtime. Reject here instead of shipping the broken artifact to
          # R2. (Historical note: this guard was introduced when a
          # libstdc++-built libassimp crashed CI's Linux x64 FBX round-trip
          # test; libassimp no longer ships in these zips — it moved to the
          # assimp_dart repository — but the check still guards the Filament
          # archives this package links.)
          cpprefs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep ' U _ZNSt7__cxx11' || true)
          if [ -n "$cpprefs" ]; then
            echo "Archives reference the libstdc++ ABI (_ZNSt7__cxx11); they must be built with -stdlib=libc++ (see scripts/build_linux.sh):"
            echo "$cpprefs" | head -20
            exit 1
          fi
          echo "OK: no libstdc++-ABI references (single libc++ ABI)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-arm64-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-arm64-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-arm64-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-arm64-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          for variant in release debug; do
            bash scripts/upload_filament_hashed.sh \
              "output/filament-${{ env.FILAMENT_VERSION }}-linux-arm64-${variant}.zip"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'windows')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.0'

      - name: Build Filament
        shell: cmd
        run: |
          mkdir output
          scripts\build_windows.bat filament %FILAMENT_VERSION% output --clean

      - name: Verify GLTFIO_USE_FILESYSTEM patch
        shell: bash
        run: |
          header="filament/libs/gltfio/src/FFilamentAsset.h"
          cmake="filament/libs/gltfio/CMakeLists.txt"
          echo "=== Checking $header ==="
          if grep -q "ifndef GLTFIO_USE_FILESYSTEM" "$header"; then
            echo "OK: #ifndef guard found in FFilamentAsset.h"
          else
            echo "FAILED: #ifndef GLTFIO_USE_FILESYSTEM guard not found in FFilamentAsset.h"
            echo "--- Relevant lines ---"
            grep -n -A5 "GLTFIO_USE_FILESYSTEM" "$header" || true
            exit 1
          fi
          echo "=== Checking $cmake ==="
          if grep -q "GLTFIO_USE_FILESYSTEM=0" "$cmake"; then
            echo "OK: GLTFIO_USE_FILESYSTEM=0 found in CMakeLists.txt"
          else
            echo "FAILED: GLTFIO_USE_FILESYSTEM=0 not found in gltfio CMakeLists.txt"
            echo "--- Last 5 lines ---"
            tail -5 "$cmake"
            exit 1
          fi

      - name: Verify packaged Windows shader tools
        run: python scripts/verify-material-host-tools.py "output/filament-${{ env.FILAMENT_VERSION }}-windows-release.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-windows-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-windows-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-windows-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-windows-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        shell: bash
        run: |
          pip install awscli
          for variant in release debug; do
            bash scripts/upload_filament_hashed.sh \
              "output/filament-${{ env.FILAMENT_VERSION }}-windows-${variant}.zip"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-web:
    name: Build Web
    runs-on: ubuntu-24.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'web') && inputs.webgpu_filament_run == ''
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Install dependencies
        run: |
          set -euo pipefail
          # apt can stall for hours on runner-network DNS blackholes
          # (azure.archive.ubuntu.com); cap each command and retry the batch.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i/3 failed: $*" >&2; sleep 20; done; return 1; }
          retry sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          retry sudo apt-get install -y -o Acquire::http::Timeout=30 clang libc++-dev libc++abi-dev ninja-build libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev
          retry sudo apt-get install -y -o Acquire::http::Timeout=30 \
            libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-image0-dev libxcb-render0-dev libxcb-keysyms1-dev libxcb-util-dev \
            libxcb-xkb-dev libxshmfence-dev libxkbcommon-dev libxkbcommon-x11-dev libgbm-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.4'

      - name: Reuse pinned host tools for upstream WebGPU builds
        if: inputs.filament_repo == '' && inputs.filament_version == ''
        run: |
          set -euo pipefail
          if [ "$FILAMENT_REPO" != https://github.com/google/filament ]; then exit 0; fi
          tools="$RUNNER_TEMP/webgpu-host-tools"
          official="$RUNNER_TEMP/filament-desktop.tgz"
          pinned="$RUNNER_TEMP/filament-pinned-linux.zip"
          release="https://github.com/google/filament/releases/download/$FILAMENT_VERSION/filament-$FILAMENT_VERSION-linux.tgz"
          sha=$(python3 -c 'import json; print(json.load(open("thermion_dart/filament.libs.json")).get("linux/release", ""))')
          mkdir -p "$tools"
          # The pinned matc supports WGSL. The other tools come from the same upstream release.
          if [ -n "$sha" ] &&
             curl -fLsS --retry 2 "$release" -o "$official" &&
             tar -xzf "$official" -C "$tools" --strip-components=1 filament/bin &&
             curl -fLsS --retry 2 "$(python3 scripts/filament-artifact-url.py linux release)" -o "$pinned" &&
             printf '%s  %s\n' "$sha" "$pinned" | sha256sum --check --status &&
             unzip -oq "$pinned" bin/matc bin/resgen -d "$tools"; then
            echo "WEBGPU_HOST_TOOLS=$tools" >> "$GITHUB_ENV"
          else
            echo "Matching downloads unavailable. Building the WebGPU host tools from source."
          fi

      - name: Build Filament
        run: |
          set -euo pipefail
          mkdir -p output
          args=()
          if [ -n "${WEBGPU_HOST_TOOLS:-}" ]; then args+=(--tools-dir "$WEBGPU_HOST_TOOLS"); fi
          scripts/build_web.sh filament "$FILAMENT_VERSION" output --clean "${args[@]}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-release.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-debug.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload WebGPU release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-release-webgpu
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-release-webgpu.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload WebGPU debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-debug-webgpu
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-debug-webgpu.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          set -euo pipefail
          for variant in release debug release-webgpu debug-webgpu; do
            bash scripts/upload_filament_hashed.sh "output/filament-$FILAMENT_VERSION-web-$variant.zip"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-webgpu-engine:
    name: Build WebGPU engine
    needs: [setup, build-web]
    if: >-
      !cancelled() && needs.setup.result == 'success' &&
      (needs.build-web.result == 'success' || inputs.webgpu_filament_run != '') &&
      inputs.platform == 'web' && inputs.filament_repo == '' && inputs.filament_version == ''
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: filament-web-release-webgpu
          path: filament-webgpu
          run-id: ${{ inputs.webgpu_filament_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.4'
          actions-cache-folder: emsdk-cache

      - name: Install libraries and build the engine
        run: |
          set -euo pipefail
          web=thermion_dart/native/web
          mkdir -p "$web/lib/release"
          unzip -q "filament-webgpu/filament-$FILAMENT_VERSION-web-release-webgpu.zip" -d "$web/lib/release"
          emcmake cmake -S "$web" -B "$web/build-webgpu" -DCMAKE_BUILD_TYPE=Release \
            -DTHERMION_ENABLE_WEBGPU=ON
          cmake --build "$web/build-webgpu" --parallel 2

      - name: Package engine archive
        id: package
        run: |
          set -euo pipefail
          web=thermion_dart/native/web
          version=$(cat "$web/web.version")
          # Reuse the public version when only the pointer or unrelated files
          # changed after its build. A candidate gets its own commit ID.
          if ! git cat-file -e "$version^{commit}" 2>/dev/null || \
             ! git diff --quiet "$version" -- filament.version thermion_dart/filament.libs.json \
                  thermion_dart/native thermion_dart/lib/src/bindings ":(exclude)$web/web.version"; then
            version=$(git rev-parse --short HEAD)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p webgpu-engines
          engine_dir="$web/build-webgpu/build/out"
          zip -j "webgpu-engines/thermion_dart-$version-web-webgpu.zip" \
            "$engine_dir/thermion_dart.js" "$engine_dir/thermion_dart.wasm"

      - uses: actions/upload-artifact@v4
        with:
          name: thermion-webgpu-engines
          path: webgpu-engines/

  verify-webgpu-engine:
    name: Verify and publish the WebGPU engine
    needs: build-webgpu-engine
    # Reusing an archive skips Build Web, an indirect dependency of this job.
    if: ${{ !cancelled() && needs.build-webgpu-engine.result == 'success' }}
    permissions:
      actions: read
      contents: read
    # Linux Chromium's software compositor cannot present the WebGPU canvas.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      WEB_ENGINE_VERSION: ${{ needs.build-webgpu-engine.outputs.version }}
      CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thermion-webgpu-engines
          path: webgpu-engines
      - uses: dart-lang/setup-dart@v1

      - name: Compile the browser scene
        working-directory: thermion_dart
        run: |
          dart pub get
          mkdir -p "$RUNNER_TEMP/webgpu-scene"
          # Same scene CI runs as a package:test browser suite
          # (run-dart-tests.yml, "Dart Tests (web, chrome, webgpu scene)"):
          # the harness hosts the suite's main() and POSTs the result to
          # scripts/check-webgpu-canvas.py.
          dart compile js tool/webgpu_scene_harness.dart -o "$RUNNER_TEMP/webgpu-scene/app.js"

      - name: Render a WebGPU scene from the staged archive
        run: |
          set -euo pipefail
          unzip -o "webgpu-engines/thermion_dart-$WEB_ENGINE_VERSION-web-webgpu.zip" -d "$RUNNER_TEMP/webgpu-scene"
          python3 scripts/check-webgpu-canvas.py "$RUNNER_TEMP/webgpu-scene" --chrome "$CHROME_EXECUTABLE"

      - name: Publish and verify the public archives
        if: inputs.upload_to_r2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          # Both WebGPU selectors use the same main-thread engine.
          archive="webgpu-engines/thermion_dart-$WEB_ENGINE_VERSION-web-webgpu.zip"
          for suffix in webgpu main-thread-webgpu; do
            artifact="thermion_dart-$WEB_ENGINE_VERSION-web-$suffix.zip"
            aws s3 cp "$archive" "s3://thermion/$artifact" --endpoint-url "$R2_ENDPOINT"
            curl -fL --retry 3 "$R2_PUBLIC_URL/$artifact" -o "$RUNNER_TEMP/published-webgpu.zip"
            cmp "$archive" "$RUNNER_TEMP/published-webgpu.zip"
          done

      - name: Render from the published R2 archive
        if: inputs.upload_to_r2
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$R2_PUBLIC_URL/thermion_dart-$WEB_ENGINE_VERSION-web-webgpu.zip" \
            -o "$RUNNER_TEMP/published-webgpu.zip"
          unzip -o "$RUNNER_TEMP/published-webgpu.zip" -d "$RUNNER_TEMP/webgpu-scene"
          python3 scripts/check-webgpu-canvas.py "$RUNNER_TEMP/webgpu-scene" --chrome "$CHROME_EXECUTABLE"
