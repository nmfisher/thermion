name: Build Filament

on:
  workflow_dispatch:
    inputs:
      filament_version:
        description: 'Filament version/tag to build (overrides filament.version file)'
        required: false
        type: string
      platform:
        description: 'Platform(s) to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - ios
          - android
          - linux
          - windows
          - web
      clean_build:
        description: 'Clean build (remove existing artifacts)'
        required: false
        default: true
        type: boolean
      upload_to_r2:
        description: 'Upload artifacts to R2'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  R2_BUCKET_NAME: thermion
  R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
  R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_PUBLIC_URL: https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      filament_version: ${{ steps.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Filament version
        id: read-version
        run: |
          if [ -n "${{ inputs.filament_version }}" ]; then
            VERSION="${{ inputs.filament_version }}"
          else
            VERSION=$(cat filament.version)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Filament version: $VERSION"

      - name: Determine build matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.platform }}" = "all" ]; then
            MATRIX='["macos", "ios", "android", "linux", "windows", "web"]'
          else
            MATRIX='["${{ inputs.platform }}"]'
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Building platforms: $MATRIX"

  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'macos')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        uses: actions/checkout@v4
        with:
          repository: google/filament
          ref: ${{ env.FILAMENT_VERSION }}
          path: filament

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ env.FILAMENT_VERSION }}
          restore-keys: ccache-macos-

      - name: Build Filament
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          mkdir -p output
          chmod +x scripts/build_macos.sh
          scripts/build_macos.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-macos-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-macos-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-macos-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-macos-debug.zip
          retention-days: 7

      - name: Upload to R2 (release)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl-public
        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-macos-release.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-macos-release.zip

      - name: Upload to R2 (debug)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl-public
        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-macos-debug.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-macos-debug.zip

  build-ios:
    name: Build iOS
    runs-on: macos-14
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'ios')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        uses: actions/checkout@v4
        with:
          repository: google/filament
          ref: ${{ env.FILAMENT_VERSION }}
          path: filament

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ env.FILAMENT_VERSION }}
          restore-keys: ccache-ios-

      - name: Build Filament
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          mkdir -p output
          chmod +x scripts/build_ios.sh
          scripts/build_ios.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
