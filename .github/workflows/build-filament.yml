        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-linux-debug.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-linux-debug.zip

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'windows')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        uses: actions/checkout@v4
        with:
          repository: google/filament
          ref: ${{ env.FILAMENT_VERSION }}
          path: filament

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.0'

      - name: Build Filament
        shell: cmd
        run: |
          mkdir output
          scripts\build_windows.bat filament %FILAMENT_VERSION% output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-windows-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-windows-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-windows-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-windows-debug.zip
          retention-days: 7

      - name: Upload to R2 (release)
        if: inputs.upload_to_r2
