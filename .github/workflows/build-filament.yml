          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-debug.zip
          retention-days: 7

      - name: Upload to R2 (release)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl-public
        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-linux-release.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-linux-release.zip

      - name: Upload to R2 (debug)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
