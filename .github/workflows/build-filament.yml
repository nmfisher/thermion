name: Build Filament

on:
  workflow_dispatch:
    inputs:
      filament_repo:
        description: 'Filament repository as owner/repo (overrides filament.version file)'
        required: false
        type: string
      filament_version:
        description: 'Filament version/tag/branch to build (overrides filament.version file)'
        required: false
        type: string
      platform:
        description: 'Platform(s) to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - ios
          - android
          - linux
          - windows
          - web
      clean_build:
        description: 'Clean build (remove existing artifacts)'
        required: false
        default: true
        type: boolean
      upload_to_r2:
        description: 'Upload artifacts to R2'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  R2_BUCKET_NAME: thermion
  R2_ENDPOINT: https://260d4efc65af500536ea376de6452ece.r2.cloudflarestorage.com
  R2_PUBLIC_URL: https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      filament_version: ${{ steps.read-version.outputs.version }}
      filament_repo: ${{ steps.read-version.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Filament version
        id: read-version
        run: |
          if [ -n "${{ inputs.filament_version }}" ] && [ -n "${{ inputs.filament_repo }}" ]; then
            REPO="${{ inputs.filament_repo }}"
            VERSION="${{ inputs.filament_version }}"
          else
            read -r REPO VERSION < filament.version
          fi
          # Override individually if provided
          [ -n "${{ inputs.filament_repo }}" ] && REPO="${{ inputs.filament_repo }}"
          [ -n "${{ inputs.filament_version }}" ] && VERSION="${{ inputs.filament_version }}"
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Filament repo: $REPO ref: $VERSION"

      - name: Determine build matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.platform }}" = "all" ]; then
            MATRIX='["macos", "ios", "android", "linux", "windows", "web"]'
          else
            MATRIX='["${{ inputs.platform }}"]'
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Building platforms: $MATRIX"

  build-macos:
    name: Build macOS
    # Xcode 16 (Clang 16+) is required for Dawn's use of C++20 parenthesized
    # aggregate initialization (P0960). macos-14 ships Xcode 15.4 / Clang 15,
    # which lacks P0960 and fails compiling third_party/dawn/src/dawn/platform.
    runs-on: macos-15
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'macos')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_macos.sh
          scripts/build_macos.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-macos-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-macos-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-macos-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-macos-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          pip3 install --break-system-packages awscli
          for variant in release debug; do
            aws s3 cp \
              "output/filament-${{ env.FILAMENT_VERSION }}-macos-${variant}.zip" \
              "s3://${{ env.R2_BUCKET_NAME }}/filament-${{ env.FILAMENT_VERSION }}-macos-${variant}.zip" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-ios:
    name: Build iOS
    runs-on: macos-14
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'ios')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build Filament (device)
        run: |
          mkdir -p output
          chmod +x scripts/build_ios.sh
          scripts/build_ios.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Build Filament (arm64 simulator)
        run: |
          chmod +x scripts/build_ios_simulator.sh
          scripts/build_ios_simulator.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-debug.zip
          retention-days: 7

      - name: Upload simulator release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-simulator-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-simulator-release.zip
          retention-days: 7

      - name: Upload simulator debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-ios-simulator-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-ios-simulator-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          pip3 install --break-system-packages awscli
          for platform in ios ios-simulator; do
            for variant in release debug; do
              aws s3 cp \
                "output/filament-${{ env.FILAMENT_VERSION }}-${platform}-${variant}.zip" \
                "s3://${{ env.R2_BUCKET_NAME }}/filament-${{ env.FILAMENT_VERSION }}-${platform}-${variant}.zip" \
                --endpoint-url "${{ env.R2_ENDPOINT }}"
            done
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'android')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build libxcb1-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_android.sh
          scripts/build_android.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-android-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-android-debug.zip
          retention-days: 7

      - name: Upload full out directory
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-out
          path: filament/out/
          retention-days: 3

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          for variant in release debug; do
            aws s3 cp \
              "output/filament-${{ env.FILAMENT_VERSION }}-android-${variant}.zip" \
              "s3://${{ env.R2_BUCKET_NAME }}/filament-${{ env.FILAMENT_VERSION }}-android-${variant}.zip" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-linux:
    name: Build Linux
    # ubuntu-22.04 (glibc 2.35) is deliberate — it is the oldest glibc we
    # support, matching the ubuntu-22.04 Dart Tests runner. Building on
    # ubuntu-24.04 (glibc 2.39) made the static archives reference
    # __isoc23_*@GLIBC_2.38 (ISO C23 strtol/strtoul/sscanf redirects emitted
    # by glibc >= 2.38 headers), which dlopen cannot resolve on older
    # distros ("undefined symbol: __isoc23_strtol"). glibc's redirect has no
    # compile-time opt-out, so the only fix is older headers at build time.
    # Filament needs clang/libc++ >= 17 and jammy's distro clang is 14, so
    # the install step below adds clang-18 from apt.llvm.org — the same major
    # version ubuntu-24.04 shipped, keeping the toolchain identical while
    # dropping only the glibc baseline.
    runs-on: ubuntu-22.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'linux')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup CMake
        # jammy ships CMake 3.22; pin the same 3.30 the Windows job uses so
        # the only variable changing vs the previous ubuntu-24.04 build is
        # the glibc headers.
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates wget ninja-build \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev
          # clang-18 + libc++ 18 from apt.llvm.org (jammy's distro clang is
          # 14, too old for Filament). See the runs-on comment above.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          # build_linux.sh hardcodes CC=clang/CXX=clang++ and apt.llvm.org
          # only installs versioned binaries, so point the unversioned names
          # at clang-18.
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 200
          clang --version

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_linux.sh
          scripts/build_linux.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Reject glibc symbol references newer than 2.35
        # Guards the glibc baseline described in the runs-on comment above:
        # a static archive compiled against glibc >= 2.38 headers references
        # __isoc23_*@GLIBC_2.38 and dlopen fails on older distros. Fail the
        # build here instead of uploading a broken artifact to R2.
        run: |
          set -euo pipefail
          rm -rf check && mkdir check && cd check
          for z in ../output/filament-*.zip; do
            # Each zip gets its own subdir: the release and debug zips
            # contain same-named archives, and extracting both into one
            # directory makes unzip prompt "replace X?" interactively —
            # a runner has no stdin, so unzip dies on EOF before nm ever
            # runs. Separate dirs also keep nm's output attributed to
            # the zip the bad archive came from.
            d="$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q "$z" -d "$d"
          done
          # Archive members reference these without a version suffix (nm shows
          # plain "U __isoc23_strtol"), so match on names: the ISO C23
          # strtol/strtoul/sscanf family glibc >= 2.38 renamed to __isoc23_*,
          # plus any explicitly versioned ref newer than GLIBC_2.35.
          refs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep -E ' U (__isoc23_|.*@GLIBC_2\.(3[6-9]|[4-9][0-9]))' || true)
          if [ -n "$refs" ]; then
            echo "Archives reference glibc symbols newer than GLIBC_2.35;"
            echo "they would fail to dlopen on ubuntu-22.04 (glibc 2.35):"
            echo "$refs"
            exit 1
          fi
          echo "OK: no glibc symbol references newer than GLIBC_2.35"

          # Single C++ ABI: every archive in the zip must be libc++-clean.
          # libthermion_dart.so links all of them with -stdlib=libc++, so a
          # libstdc++-built archive (undefined _ZNSt7__cxx11... std::string
          # refs) pulls a second C++ runtime into the process; the two
          # runtimes' exception/unwind machinery then conflict and crash at
          # runtime (CI's Linux x64 FBX round-trip SEGV'd inside libc++abi
          # before libassimp was switched to -stdlib=libc++). Reject here
          # instead of shipping the broken artifact to R2.
          cpprefs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep ' U _ZNSt7__cxx11' || true)
          if [ -n "$cpprefs" ]; then
            echo "Archives reference the libstdc++ ABI (_ZNSt7__cxx11); they must be built with -stdlib=libc++ (see scripts/build_linux.sh):"
            echo "$cpprefs" | head -20
            exit 1
          fi
          echo "OK: no libstdc++-ABI references (single libc++ ABI)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          for variant in release debug; do
            aws s3 cp \
              "output/filament-${{ env.FILAMENT_VERSION }}-linux-${variant}.zip" \
              "s3://${{ env.R2_BUCKET_NAME }}/filament-${{ env.FILAMENT_VERSION }}-linux-${variant}.zip" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-linux-arm64:
    name: Build Linux (arm64)
    # GitHub-hosted arm64 runner — build_linux.sh detects the host arch and
    # produces filament-<version>-linux-arm64-{release,debug}.zip.
    # ubuntu-22.04-arm for the same glibc 2.35 baseline as build-linux above.
    runs-on: ubuntu-22.04-arm
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'linux')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup CMake
        # jammy ships CMake 3.22; pin the same 3.30 the Windows job uses so
        # the only variable changing vs the previous ubuntu-24.04 build is
        # the glibc headers.
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates wget ninja-build \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev
          # clang-18 + libc++ 18 from apt.llvm.org (jammy's distro clang is
          # 14, too old for Filament). See the runs-on comment above.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          # build_linux.sh hardcodes CC=clang/CXX=clang++ and apt.llvm.org
          # only installs versioned binaries, so point the unversioned names
          # at clang-18.
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 200
          clang --version

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_linux.sh
          scripts/build_linux.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Reject glibc symbol references newer than 2.35
        # Guards the glibc baseline described in the runs-on comment above:
        # a static archive compiled against glibc >= 2.38 headers references
        # __isoc23_*@GLIBC_2.38 and dlopen fails on older distros. Fail the
        # build here instead of uploading a broken artifact to R2.
        run: |
          set -euo pipefail
          rm -rf check && mkdir check && cd check
          for z in ../output/filament-*.zip; do
            # Each zip gets its own subdir: the release and debug zips
            # contain same-named archives, and extracting both into one
            # directory makes unzip prompt "replace X?" interactively —
            # a runner has no stdin, so unzip dies on EOF before nm ever
            # runs. Separate dirs also keep nm's output attributed to
            # the zip the bad archive came from.
            d="$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q "$z" -d "$d"
          done
          # Archive members reference these without a version suffix (nm shows
          # plain "U __isoc23_strtol"), so match on names: the ISO C23
          # strtol/strtoul/sscanf family glibc >= 2.38 renamed to __isoc23_*,
          # plus any explicitly versioned ref newer than GLIBC_2.35.
          refs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep -E ' U (__isoc23_|.*@GLIBC_2\.(3[6-9]|[4-9][0-9]))' || true)
          if [ -n "$refs" ]; then
            echo "Archives reference glibc symbols newer than GLIBC_2.35;"
            echo "they would fail to dlopen on ubuntu-22.04 (glibc 2.35):"
            echo "$refs"
            exit 1
          fi
          echo "OK: no glibc symbol references newer than GLIBC_2.35"

          # Single C++ ABI: every archive in the zip must be libc++-clean.
          # libthermion_dart.so links all of them with -stdlib=libc++, so a
          # libstdc++-built archive (undefined _ZNSt7__cxx11... std::string
          # refs) pulls a second C++ runtime into the process; the two
          # runtimes' exception/unwind machinery then conflict and crash at
          # runtime (CI's Linux x64 FBX round-trip SEGV'd inside libc++abi
          # before libassimp was switched to -stdlib=libc++). Reject here
          # instead of shipping the broken artifact to R2.
          cpprefs=$(nm -A $(find . -name '*.a') 2>/dev/null | grep ' U _ZNSt7__cxx11' || true)
          if [ -n "$cpprefs" ]; then
            echo "Archives reference the libstdc++ ABI (_ZNSt7__cxx11); they must be built with -stdlib=libc++ (see scripts/build_linux.sh):"
            echo "$cpprefs" | head -20
            exit 1
          fi
          echo "OK: no libstdc++-ABI references (single libc++ ABI)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-arm64-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-arm64-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-linux-arm64-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-linux-arm64-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          for variant in release debug; do
            aws s3 cp \
              "output/filament-${{ env.FILAMENT_VERSION }}-linux-arm64-${variant}.zip" \
              "s3://${{ env.R2_BUCKET_NAME }}/filament-${{ env.FILAMENT_VERSION }}-linux-arm64-${variant}.zip" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'windows')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.0'

      - name: Build Filament
        shell: cmd
        run: |
          mkdir output
          scripts\build_windows.bat filament %FILAMENT_VERSION% output --clean

      - name: Verify GLTFIO_USE_FILESYSTEM patch
        shell: bash
        run: |
          header="filament/libs/gltfio/src/FFilamentAsset.h"
          cmake="filament/libs/gltfio/CMakeLists.txt"
          echo "=== Checking $header ==="
          if grep -q "ifndef GLTFIO_USE_FILESYSTEM" "$header"; then
            echo "OK: #ifndef guard found in FFilamentAsset.h"
          else
            echo "FAILED: #ifndef GLTFIO_USE_FILESYSTEM guard not found in FFilamentAsset.h"
            echo "--- Relevant lines ---"
            grep -n -A5 "GLTFIO_USE_FILESYSTEM" "$header" || true
            exit 1
          fi
          echo "=== Checking $cmake ==="
          if grep -q "GLTFIO_USE_FILESYSTEM=0" "$cmake"; then
            echo "OK: GLTFIO_USE_FILESYSTEM=0 found in CMakeLists.txt"
          else
            echo "FAILED: GLTFIO_USE_FILESYSTEM=0 not found in gltfio CMakeLists.txt"
            echo "--- Last 5 lines ---"
            tail -5 "$cmake"
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-windows-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-windows-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-windows-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-windows-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        shell: bash
        run: |
          pip install awscli
          for variant in release debug; do
            aws s3 cp \
              "output/filament-${{ env.FILAMENT_VERSION }}-windows-${variant}.zip" \
              "s3://${{ env.R2_BUCKET_NAME }}/filament-${{ env.FILAMENT_VERSION }}-windows-${variant}.zip" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  build-web:
    name: Build Web
    runs-on: ubuntu-24.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'web')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
      FILAMENT_REPO: ${{ needs.setup.outputs.filament_repo }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        run: git clone --depth 1 --branch ${{ env.FILAMENT_VERSION }} ${{ env.FILAMENT_REPO }} filament

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.4'

      - name: Build Filament
        run: |
          mkdir -p output
          chmod +x scripts/build_web.sh
          scripts/build_web.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-debug.zip
          retention-days: 7

      - name: Upload to R2
        if: inputs.upload_to_r2
        run: |
          for variant in release debug; do
            aws s3 cp \
              "output/filament-${{ env.FILAMENT_VERSION }}-web-${variant}.zip" \
              "s3://${{ env.R2_BUCKET_NAME }}/filament-${{ env.FILAMENT_VERSION }}-web-${variant}.zip" \
              --endpoint-url "${{ env.R2_ENDPOINT }}"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
