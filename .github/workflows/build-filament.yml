        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-ios-release.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-ios-release.zip

      - name: Upload to R2 (debug)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl-public
        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-ios-debug.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-ios-debug.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-22.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'android')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        uses: actions/checkout@v4
        with:
          repository: google/filament
          ref: ${{ env.FILAMENT_VERSION }}
          path: filament

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.FILAMENT_VERSION }}
          restore-keys: ccache-android-

      - name: Build Filament
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          mkdir -p output
          chmod +x scripts/build_android.sh
          scripts/build_android.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-android-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-android-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-android-debug.zip
          retention-days: 7

      - name: Upload to R2 (release)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl-public
        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-android-release.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-android-release.zip

      - name: Upload to R2 (debug)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl-public
        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-android-debug.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-android-debug.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'linux')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        uses: actions/checkout@v4
        with:
          repository: google/filament
          ref: ${{ env.FILAMENT_VERSION }}
          path: filament

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build ccache libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxxf86vm-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ env.FILAMENT_VERSION }}
          restore-keys: ccache-linux-

      - name: Build Filament
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          mkdir -p output
          chmod +x scripts/build_linux.sh
          scripts/build_linux.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
