          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-windows-debug.zip
          DEST_DIR: filament-${{ env.FILAMENT_VERSION }}-windows-debug.zip

  build-web:
    name: Build Web
    runs-on: ubuntu-22.04
    needs: setup
    if: contains(needs.setup.outputs.matrix, 'web')
    env:
      FILAMENT_VERSION: ${{ needs.setup.outputs.filament_version }}
    steps:
      - name: Checkout thermion
        uses: actions/checkout@v4

      - name: Checkout Filament
        uses: actions/checkout@v4
        with:
          repository: google/filament
          ref: ${{ env.FILAMENT_VERSION }}
          path: filament

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ env.FILAMENT_VERSION }}
          restore-keys: ccache-web-

      - name: Build Filament
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          mkdir -p output
          chmod +x scripts/build_web.sh
          scripts/build_web.sh filament ${{ env.FILAMENT_VERSION }} output --clean

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-release
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-release.zip
          retention-days: 7

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-web-debug
          path: output/filament-${{ env.FILAMENT_VERSION }}-web-debug.zip
          retention-days: 7

      - name: Upload to R2 (release)
        if: inputs.upload_to_r2
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl-public
        env:
          AWS_S3_BUCKET: ${{ env.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ env.R2_ENDPOINT }}
          SOURCE_DIR: output/filament-${{ env.FILAMENT_VERSION }}-web-release.zip
