name: CI (Windows Dart Tests)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dart-tests-windows:
    name: Dart Tests (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "16"

      - name: Add LLVM to PATH
        shell: bash
        run: echo "${{ github.workspace }}/llvm/bin" >> $GITHUB_PATH

      - name: Verify LLVM installation
        run: clang --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          architecture: X64

      - name: Enable debug mode for tests
        shell: bash
        run: |
          echo 'hooks:' >> thermion_dart/pubspec.yaml
          echo '  user_defines:' >> thermion_dart/pubspec.yaml
          echo '    thermion_dart:' >> thermion_dart/pubspec.yaml
          echo '      mode: debug' >> thermion_dart/pubspec.yaml

      - name: Run tests
        working-directory: thermion_dart
        run: |
          dart pub get
          dart test -j1 `
            test/asset_tests.dart `
            test/instancing_tests.dart `
            test/light_tests.dart `
            test/entity_tests.dart `
            test/geometry_tests.dart `
            test/view_tests.dart `
            test/postprocessing_tests.dart `
            test/scene_tests.dart `
            test/picking_tests.dart `
            test/image_tests.dart `
            --concurrency=1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-dart
          path: |
            D:\a\thermion\thermion\thermion_dart\.dart_tool\thermion_dart\log\build.log
          retention-days: 5
