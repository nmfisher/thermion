name: Dart Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

jobs:
  js-callback-tests:
    name: JavaScript Callback Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - uses: dart-lang/setup-dart@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run pointer callback regression tests (Node)
        working-directory: thermion_dart
        run: |
          # dart test starts through the VM and fires the package build hook,
          # but these JS bindings tests do not need a native renderer.
          awk '
            /^hooks:/ { skip=1; next }
            skip && /^[^[:space:]#]/ { skip=0 }
            !skip { print }
          ' pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          cat >> pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                skip_native_build: true
          EOF
          dart pub get
          dart test -p node test/js_pointer_callback_test.dart -r expanded

  dart-tests:
    name: Dart Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup build environment (Linux)
        if: matrix.name == 'Linux'
        uses: ./.github/actions/setup-build-env

      - name: Install EGL libraries (Linux)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      - name: Setup build environment (Windows)
        if: matrix.name == 'Windows'
        uses: ./.github/actions/setup-windows-env

      - name: Enable debug mode for tests
        shell: bash
        run: |
          # pubspec.yaml ships a local-only hooks.user_defines block (the
          # WebGPU/Dawn toggle). Strip any existing block before appending:
          # appending on top of it leaves two top-level `hooks:` keys, and
          # `dart pub get` then fails with "Duplicate mapping key".
          # CI runs the native backend, so the local WebGPU override must go.
          awk '
            /^hooks:/ { skip=1; next }
            skip && /^[^[:space:]#]/ { skip=0 }
            !skip { print }
          ' thermion_dart/pubspec.yaml > thermion_dart/pubspec.yaml.tmp
          mv thermion_dart/pubspec.yaml.tmp thermion_dart/pubspec.yaml
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                mode: debug
          EOF

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run tests (Linux)
        if: matrix.name == 'Linux'
        working-directory: thermion_dart
        run: |
          dart pub get
          xvfb-run dart test -j1 \
            test/asset_tests.dart \
            test/instancing_tests.dart \
            test/light_tests.dart \
            test/entity_tests.dart \
            test/geometry_tests.dart \
            test/viewer_lifecycle_test.dart \
            test/asset_lifecycle_test.dart \
            test/transform_tests.dart \
            test/view_tests.dart \
            test/pcss_controls_render_test.dart \
            test/postprocessing_tests.dart \
            test/scene_tests.dart \
            test/picking_tests.dart \
            test/image_tests.dart \
            test/gltf_animation_tests.dart \
            test/bone_animation_tests.dart \
            test/morph_animation_tests.dart \
            test/renderable_manager_tests.dart \
            test/procedural_renderable_test.dart \
            test/gltf_parser_tests.dart \
            test/overlay_tests.dart \
            test/wireframe_renderable_test.dart \
            test/gizmo_tests_new.dart \
            test/all_axes_test.dart \
            test/bone_picking_tests.dart \
            test/all_materials_smoke_test.dart \
            test/skybox_tests.dart \
            --concurrency=1

      - name: Run tests (Windows)
        if: matrix.name == 'Windows'
        working-directory: thermion_dart
        shell: pwsh
        env:
          VK_ICD_FILENAMES: C:\swiftshader\vk_swiftshader_icd.json
        run: |
          dart pub get
          dart test -j1 `
            test/asset_tests.dart `
            test/instancing_tests.dart `
            test/light_tests.dart `
            test/entity_tests.dart `
            test/geometry_tests.dart `
            test/viewer_lifecycle_test.dart `
            test/asset_lifecycle_test.dart `
            test/transform_tests.dart `
            test/view_tests.dart `
            test/pcss_controls_render_test.dart `
            test/postprocessing_tests.dart `
            test/scene_tests.dart `
            test/picking_tests.dart `
            test/image_tests.dart `
            test/overlay_tests.dart `
            test/wireframe_renderable_test.dart `
            test/gizmo_tests_new.dart `
            test/all_axes_test.dart `
            test/all_materials_smoke_test.dart `
            test/skybox_tests.dart `
            --concurrency=1

      - name: Upload Dart test output candidate
        uses: actions/upload-artifact@v4
        with:
          name: dart-test-output-${{ matrix.name }}
          path: thermion_dart/test/output

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  # macOS runs the Metal backend against a headless swapchain. Metal needs no
  # display server (unlike the Linux job's xvfb) and no software rasterizer
  # (unlike the Windows job's SwiftShader), so the only setup needed is the
  # Dart SDK: the build hook downloads the universal macOS Filament archive
  # from R2 and compiles the glue sources with the stock Apple toolchain.
  # The material variant is the default "native" one, which matc built with
  # -a metal among its targets.
  #
  # The test list is a deliberate subset: it starts with the tests that cover
  # the per-platform materials (image, grid, translation_axis, wireframe,
  # gizmo) and the basic asset path. Widen it gradually rather than mirroring
  # the Linux list wholesale, which was never validated on macOS.
  dart-tests-macos:
    name: Dart Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-macOS-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-macOS-

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Enable debug mode for tests
        shell: bash
        run: |
          # See the equivalent step in dart-tests: strip the local-only
          # hooks.user_defines block before appending, so the file never
          # carries two top-level `hooks:` keys.
          awk '
            /^hooks:/ { skip=1; next }
            skip && /^[^[:space:]#]/ { skip=0 }
            !skip { print }
          ' thermion_dart/pubspec.yaml > thermion_dart/pubspec.yaml.tmp
          mv thermion_dart/pubspec.yaml.tmp thermion_dart/pubspec.yaml
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                mode: debug
          EOF

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run tests (macOS)
        working-directory: thermion_dart
        run: |
          dart pub get
          dart test -j1 \
            test/asset_tests.dart \
            test/viewer_lifecycle_test.dart \
            test/asset_lifecycle_test.dart \
            test/transform_tests.dart \
            test/image_tests.dart \
            test/overlay_tests.dart \
            test/wireframe_renderable_test.dart \
            test/gizmo_tests_new.dart \
            test/skybox_tests.dart \
            --concurrency=1

      - name: Upload Dart test output candidate
        uses: actions/upload-artifact@v4
        with:
          name: dart-test-output-macOS
          path: thermion_dart/test/output

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-macOS
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  # Exercises the single-backend material variants (_opengl/_vulkan) that
  # materials.backends opts into. Each runner gets the backend it can
  # actually render with: Linux tests render through EGL/llvmpipe under xvfb
  # (like the Linux job above), Windows through SwiftShader Vulkan
  # (VK_ICD_FILENAMES). Android's android: [vulkan] variant is covered by an
  # appbundle build in flutter-tests-and-examples.yml.
  dart-tests-material-variants:
    name: Dart Tests Material Variants (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux opengl-only
            os: ubuntu-22.04
            os-key: linux
            backends: opengl
          - name: Windows vulkan-only
            os: windows-2022
            os-key: windows
            backends: vulkan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup build environment (Linux)
        if: matrix.os-key == 'linux'
        uses: ./.github/actions/setup-build-env

      - name: Install EGL libraries (Linux)
        if: matrix.os-key == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      - name: Setup build environment (Windows)
        if: matrix.os-key == 'windows'
        uses: ./.github/actions/setup-windows-env

      - name: Select material backend variant
        shell: bash
        run: |
          # Same strip-then-append pattern as the other jobs (avoids a
          # duplicate top-level `hooks:` key), adding materials.backends on
          # top of mode: debug.
          awk '
            /^hooks:/ { skip=1; next }
            skip && /^[^[:space:]#]/ { skip=0 }
            !skip { print }
          ' thermion_dart/pubspec.yaml > thermion_dart/pubspec.yaml.tmp
          mv thermion_dart/pubspec.yaml.tmp thermion_dart/pubspec.yaml
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                mode: debug
                materials:
                  backends:
                    ${{ matrix.os-key }}: ${{ matrix.backends }}
          EOF

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run material tests (Linux)
        if: matrix.os-key == 'linux'
        working-directory: thermion_dart
        run: |
          dart pub get
          xvfb-run dart test -j1 \
            test/image_tests.dart \
            test/overlay_tests.dart \
            test/wireframe_renderable_test.dart \
            test/gizmo_tests_new.dart \
            test/all_axes_test.dart \
            test/bone_picking_tests.dart \
            test/all_materials_smoke_test.dart \
            --concurrency=1

      - name: Run material tests (Windows)
        if: matrix.os-key == 'windows'
        working-directory: thermion_dart
        env:
          VK_ICD_FILENAMES: C:\swiftshader\vk_swiftshader_icd.json
        run: dart pub get; dart test -j1 test/image_tests.dart test/overlay_tests.dart test/wireframe_renderable_test.dart test/gizmo_tests_new.dart test/all_axes_test.dart test/all_materials_smoke_test.dart --concurrency=1

      - name: Upload material-variant test output candidate
        uses: actions/upload-artifact@v4
        with:
          name: dart-material-output-${{ matrix.name }}
          path: thermion_dart/test/output

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-variants-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  compare-dart-test-output:
    name: Compare Dart Test Output (${{ matrix.name }})
    needs:
      - dart-tests
      - dart-tests-macos
      - dart-tests-material-variants
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            artifact: dart-test-output-Linux
            baseline_asset: dart-test-output-Linux.zip
            baseline_sha256: 07c462256121c6e012adf49952f797341a5076fcb9875d2f2a803760efc874de
          - name: Windows
            artifact: dart-test-output-Windows
            baseline_asset: dart-test-output-Windows.zip
            baseline_sha256: 8a2d4270fc6191e166ad12ba5d8c719e75e24e66f6b50ef134174ded755292e2
          - name: macOS
            artifact: dart-test-output-macOS
            baseline_asset: dart-test-output-macOS.zip
            baseline_sha256: 622db9ac802b40cd626bf8c7be5a7f56ce2f8c15d8a0f53be6404cfdaeae3039
          - name: Linux opengl-only
            artifact: dart-material-output-Linux opengl-only
            baseline_asset: dart-material-output-Linux-opengl-only.zip
            baseline_sha256: 465d1ba1e4514f831361214fe78bffba506f8f585a4a3e1c042f5e26d6fe467d
          - name: Windows vulkan-only
            artifact: dart-material-output-Windows vulkan-only
            baseline_asset: dart-material-output-Windows-vulkan-only.zip
            baseline_sha256: e71d53bb538c00cd28548f32e1c1fd1820249c2e1bbc956fca75da5bd55ed835
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Download current test output
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: thermion_dart/test/golden-candidate

      - name: Download reviewed platform baseline
        env:
          GH_TOKEN: ${{ github.token }}
          # Preserve reviewed PNGs in releases so Actions retention cannot
          # remove the baseline. Source: successful run 36846959241; all 631
          # PNGs also match run 40479176422 pixel-for-pixel. For a refresh,
          # review a capture run, publish a new release, then update this tag
          # and the per-platform SHA-256 values above in a reviewed PR.
          BASELINE_TAG: render-baselines-2026-10-27
          BASELINE_ASSET: ${{ matrix.baseline_asset }}
          BASELINE_SHA256: ${{ matrix.baseline_sha256 }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/thermion-golden-baseline"
          mkdir -p "$baseline_dir"
          gh release download "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASELINE_ASSET" \
            --dir "$baseline_dir"
          printf '%s  %s\n' "$BASELINE_SHA256" "$baseline_dir/$BASELINE_ASSET" | sha256sum --check --strict
          python -m zipfile -e "$baseline_dir/$BASELINE_ASSET" thermion_dart/test/golden-baseline

      - name: Add reviewed transform goldens
        if: matrix.name == 'Linux' || matrix.name == 'Windows' || matrix.name == 'macOS'
        env:
          TRANSFORM_GOLDEN_PLATFORM: ${{ matrix.name }}
        run: |
          mkdir -p thermion_dart/test/golden-baseline/transforms
          cp "thermion_dart/test/goldens/transforms/$TRANSFORM_GOLDEN_PLATFORM/"*.png \
            thermion_dart/test/golden-baseline/transforms/

      - name: Install golden comparison dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy

      - name: Compare all captured test output
        run: >-
          python thermion_dart/test/compare_goldens.py
          --golden-dir thermion_dart/test/golden-baseline
          --output-dir thermion_dart/test/golden-candidate
