name: Grid Depth Diagnostic
on:
  workflow_dispatch:
jobs:
  windows-grid:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows-env
      - name: Enable debug mode
        shell: bash
        run: |
          cat >> thermion_dart/pubspec.yaml <<EOF
          hooks:
            user_defines:
              thermion_dart:
                mode: debug
          EOF
      - name: Compare grid depth and draw orders
        working-directory: thermion_dart
        shell: pwsh
        env:
          VK_ICD_FILENAMES: C:\swiftshader\vk_swiftshader_icd.json
        run: |
          dart pub get
          dart test test/grid_depth_diagnostic_test.dart --concurrency=1 --reporter expanded
      - uses: actions/upload-artifact@v4
        with:
          name: grid-depth-diagnostic-Windows
          path: thermion_dart/test/output/grid_depth_diagnostic
