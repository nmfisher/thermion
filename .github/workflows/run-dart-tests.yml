name: Dart Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

jobs:
  js-callback-tests:
    name: JavaScript Callback Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - uses: dart-lang/setup-dart@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up LLVM for generated material export tests
        run: |
          if ! command -v clang++ || ! command -v ld.lld || ! command -v lld-link || ! command -v llvm-readobj; then
            sudo apt-get update -y
            sudo apt-get install -y clang lld llvm
          fi

      - name: Run JavaScript callback and geometry regression tests (Node)
        working-directory: thermion_dart
        run: |
          # dart test starts through the VM and fires the package build hook,
          # but these JS bindings tests do not need a native renderer.
          awk '
            /^hooks:/ { skip=1; next }
            skip && /^[^[:space:]#]/ { skip=0 }
            !skip { print }
          ' pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          cat >> pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                skip_native_build: true
          EOF
          dart pub get
          dart test -p node test/backend_enum_test.dart test/js_pointer_callback_test.dart test/js_view_picking_test.dart test/js_geometry_memory_test.dart test/js_material_memory_test.dart test/geometry_ctor_tests.dart -r expanded
          dart test test/pending_callback_test.dart test/material_symbol_export_test.dart test/material_tools_test.dart test/material_publication_test.dart test/material_hook_runner_test.dart test/backend_enum_test.dart test/filament_artifacts_test.dart test/web_artifacts_test.dart \
            test/filament_version_test.dart test/material_backend_resolution_test.dart test/resolve_pubspec_features_test.dart -r expanded

  dart-tests:
    name: Dart Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Check runtime material platform selection
        if: matrix.name == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_runtime_material_platform.py' -v

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup build environment (Linux)
        if: matrix.name == 'Linux'
        uses: ./.github/actions/setup-build-env

      - name: Install EGL libraries (Linux)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      - name: Setup build environment (Windows)
        if: matrix.name == 'Windows'
        uses: ./.github/actions/setup-windows-env

      - name: Enable debug mode for tests
        working-directory: thermion_dart
        shell: bash
        run: |
          dart pub get
          dart --packages=.dart_tool/package_config.json tool/configure_material_tests.dart

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run tests (Linux)
        if: matrix.name == 'Linux'
        working-directory: thermion_dart
        run: |
          dart pub get
          xvfb-run dart test -j1 \
            test/filament_cache_layout_test.dart \
            test/ffi_string_callback_test.dart \
            test/asset_tests.dart \
            test/instancing_tests.dart \
            test/light_tests.dart \
            test/entity_tests.dart \
            test/geometry_tests.dart \
            test/viewer_lifecycle_test.dart \
            test/asset_lifecycle_test.dart \
            test/transform_tests.dart \
            test/view_tests.dart \
            test/pcss_controls_render_test.dart \
            test/postprocessing_tests.dart \
            test/scene_tests.dart \
            test/picking_tests.dart \
            test/image_tests.dart \
            test/gltf_animation_tests.dart \
            test/bone_animation_tests.dart \
            test/morph_animation_tests.dart \
            test/renderable_manager_tests.dart \
            test/procedural_renderable_test.dart \
            test/gltf_parser_tests.dart \
            test/overlay_tests.dart \
            test/wireframe_renderable_test.dart \
            test/normal_color_material_test.dart \
            test/sharp_edge_material_test.dart \
            test/gizmo_tests_new.dart \
            test/all_axes_test.dart \
            test/bone_picking_tests.dart \
            test/all_materials_smoke_test.dart \
            test/skybox_tests.dart \
            test/texture_mip_chain_test.dart \
            test/material_compile_test.dart \
            test/webgpu_device_export_native_test.dart \
            --concurrency=1

      - name: Run tests (Windows)
        if: matrix.name == 'Windows'
        working-directory: thermion_dart
        shell: pwsh
        env:
          VK_ICD_FILENAMES: C:\swiftshader\vk_swiftshader_icd.json
        run: |
          dart pub get
          dart test -j1 `
            test/ffi_string_callback_test.dart `
            test/asset_tests.dart `
            test/instancing_tests.dart `
            test/light_tests.dart `
            test/entity_tests.dart `
            test/geometry_tests.dart `
            test/viewer_lifecycle_test.dart `
            test/asset_lifecycle_test.dart `
            test/transform_tests.dart `
            test/view_tests.dart `
            test/pcss_controls_render_test.dart `
            test/postprocessing_tests.dart `
            test/scene_tests.dart `
            test/picking_tests.dart `
            test/image_tests.dart `
            test/overlay_tests.dart `
            test/wireframe_renderable_test.dart `
            test/normal_color_material_test.dart `
            test/sharp_edge_material_test.dart `
            test/gizmo_tests_new.dart `
            test/all_axes_test.dart `
            test/all_materials_smoke_test.dart `
            test/skybox_tests.dart `
            --concurrency=1

      - name: Run native engine lock and callback regressions
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          # Read the hook's code asset rather than assuming the Dart SDK's
          # staging directory, which differs between SDKs and platforms.
          libraries = set()
          outputs = pathlib.Path('thermion_dart/.dart_tool/hooks_runner/thermion_dart')
          for output in outputs.glob('*/output.json'):
              for asset in json.loads(output.read_text()).get('assets', []):
                  encoding = asset.get('encoding', {})
                  if (asset.get('type') == 'code_assets/code'
                          and encoding.get('id') == 'package:thermion_dart/thermion_dart.dart'):
                      library = pathlib.Path(encoding['file']).resolve()
                      if library.is_file():
                          libraries.add(library)
          if len(libraries) != 1:
              raise SystemExit(f'Expected one built Thermion code asset, found: {libraries}')
          library = libraries.pop()
          print(f'Running native regressions against {library}', flush=True)
          build = pathlib.Path(os.environ['RUNNER_TEMP'], 'engine-api-lock-tests')
          subprocess.run(['cmake', '-S', 'thermion_dart/native/test/rendering', '-B', str(build),
                          '-DCMAKE_BUILD_TYPE=Debug', f'-DTHERMION_TEST_LIBRARY={library}'], check=True)
          subprocess.run(['cmake', '--build', str(build), '--config', 'Debug', '--parallel', '2'], check=True)
          subprocess.run(['ctest', '--test-dir', str(build), '-C', 'Debug', '--output-on-failure'], check=True)
          PYTHON

      - name: Upload Dart test output candidate
        uses: actions/upload-artifact@v4
        with:
          name: dart-test-output-${{ matrix.name }}
          path: thermion_dart/test/output

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  # macOS runs the Metal backend against a headless swapchain. Metal needs no
  # display server (unlike the Linux job's xvfb) and no software rasterizer
  # (unlike the Windows job's SwiftShader), so the only setup needed is the
  # Dart SDK: the build hook downloads the universal macOS Filament archive
  # from R2 and compiles the glue sources with the stock Apple toolchain.
  # The material variant is the default "native" one, which matc built with
  # -a metal among its targets.
  #
  # The test list is a deliberate subset: it starts with the tests that cover
  # the per-platform materials (image, grid, translation_axis, wireframe,
  # gizmo) and the basic asset path. Widen it gradually rather than mirroring
  # the Linux list wholesale, which was never validated on macOS.
  dart-tests-macos:
    name: Dart Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-macOS-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-macOS-

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Enable debug mode for tests
        working-directory: thermion_dart
        shell: bash
        run: |
          dart pub get
          dart --packages=.dart_tool/package_config.json tool/configure_material_tests.dart

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run tests (macOS)
        working-directory: thermion_dart
        run: |
          dart pub get
          dart test -j1 \
            test/ffi_string_callback_test.dart \
            test/asset_tests.dart \
            test/viewer_lifecycle_test.dart \
            test/asset_lifecycle_test.dart \
            test/transform_tests.dart \
            test/image_tests.dart \
            test/overlay_tests.dart \
            test/wireframe_renderable_test.dart \
            test/normal_color_material_test.dart \
            test/sharp_edge_material_test.dart \
            test/gizmo_tests_new.dart \
            test/skybox_tests.dart \
            --concurrency=1

      - name: Upload Dart test output candidate
        uses: actions/upload-artifact@v4
        with:
          name: dart-test-output-macOS
          path: thermion_dart/test/output

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-macOS
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  # Explicit enabled/disabled entry points prevent a missing build flag from
  # silently passing the fallback branches. Exercise debug/release linkage and
  # the parser on Metal, Vulkan and OpenGL; stub builds preserve UnsupportedError.
  dart-tests-runtime-materials:
    name: Runtime Materials (${{ matrix.name }}, ${{ matrix.mode }}, enabled=${{ matrix.enabled }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15, mode: debug, enabled: true }
          - { name: macOS, os: macos-15, mode: release, enabled: true }
          - { name: macOS, os: macos-15, mode: release, enabled: false }
          - { name: Windows, os: windows-2022, mode: release, enabled: true }
          - { name: Linux, os: ubuntu-22.04, mode: release, enabled: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup Linux build environment
        if: matrix.name == 'Linux'
        uses: ./.github/actions/setup-build-env

      - name: Install Linux EGL headers
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      - name: Setup Windows build environment
        if: matrix.name == 'Windows'
        uses: ./.github/actions/setup-windows-env

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Select runtime materials build for tests
        shell: bash
        run: |
          # See the equivalent step in dart-tests: strip the local-only
          # hooks.user_defines block before appending, so the file never
          # carries two top-level `hooks:` keys.
          awk '
            /^hooks:/ { skip=1; next }
            skip && /^[^[:space:]#]/ { skip=0 }
            !skip { print }
          ' thermion_dart/pubspec.yaml > thermion_dart/pubspec.yaml.tmp
          mv thermion_dart/pubspec.yaml.tmp thermion_dart/pubspec.yaml
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                mode: ${{ matrix.mode }}
                runtime_materials: ${{ matrix.enabled }}
          EOF

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run runtime material and package regression tests
        working-directory: thermion_dart
        shell: bash
        env:
          VK_ICD_FILENAMES: ${{ matrix.name == 'Windows' && 'C:\swiftshader\vk_swiftshader_icd.json' || '' }}
        run: |
          dart pub get
          ${{ matrix.name == 'Linux' && 'xvfb-run' || '' }} dart test -j1 \
            test/runtime_material_${{ matrix.enabled && 'enabled' || 'disabled' }}_test.dart \
            test/omitted_built_in_material_tests.dart \
            test/material_package_test.dart \
            ${{ matrix.enabled && 'test/runtime_material_metadata_test.dart test/runtime_material_diagnostics_test.dart' || '' }} \
            --concurrency=1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-runtime-materials-${{ matrix.name }}-${{ matrix.mode }}-${{ matrix.enabled }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  # Slim-build job for the compile-time feature opt-outs: rebuild
  # libthermion_dart with
  # gltf/ktx/image_decoding all OFF — every gltfio/ktxreader/stb reference
  # drops from the link line, so an unguarded reference is a LINK error here
  # and a guard that leaves a non-void function without a return fails under
  # Apple Clang's default -Werror=return-type (macOS). test/slim_build_test.dart
  # skips itself on default builds and runs for real on this one; the pure-Dart
  # resolve_pubspec_features_test.dart covers the `features` user-define parsing.
  # The pubspec rewrite inserts the slim `features` block under
  # hooks.user_defines.thermion_dart while KEEPING the existing `materials`
  # block — stripping the whole hooks block would drop every Material_create*
  # factory from the build and fail the export check below.
  dart-tests-slim:
    name: Slim Build Tests (${{ matrix.name }}, features off)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04 }
          - { name: macOS, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup Linux build environment
        if: matrix.name == 'Linux'
        uses: ./.github/actions/setup-build-env

      - name: Install Linux EGL libraries
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Select the slim feature configuration for tests
        shell: bash
        run: |
          awk '
            { print }
            /^    thermion_dart:$/ {
              print "      features:"
              print "        gltf: false"
              print "        ktx: false"
              print "        image_decoding: false"
            }
          ' thermion_dart/pubspec.yaml > thermion_dart/pubspec.yaml.tmp
          mv thermion_dart/pubspec.yaml.tmp thermion_dart/pubspec.yaml
          grep -q '^      materials:$' thermion_dart/pubspec.yaml
          grep -q '^      features:$' thermion_dart/pubspec.yaml

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run slim-build tests
        working-directory: thermion_dart
        shell: bash
        run: |
          dart pub get
          ${{ matrix.name == 'Linux' && 'xvfb-run' || '' }} dart test -j1 test/slim_build_test.dart test/resolve_pubspec_features_test.dart --concurrency=1

      - name: Check the slim library exports every symbol the Dart bindings use
        if: matrix.name == 'Linux'
        shell: bash
        working-directory: thermion_dart
        run: |
          # Stub contract: the generated
          # bindings are shared by every build variant and look each symbol up
          # lazily, so a missing export would only fail at the first Dart call.
          # Check the slim library against the names in the FFI bindings file.
          python3 - <<'PYTHON'
          import pathlib, re, subprocess
          libraries = {p.resolve() for p in pathlib.Path('.dart_tool/hooks_runner').rglob('libthermion_dart.so') if p.is_file()}
          if len(libraries) != 1:
              raise SystemExit(f'Expected one built libthermion_dart.so, found: {libraries}')
          library = libraries.pop()
          print(f'Checking exports of {library}', flush=True)
          exported = {line.split()[-1].split('@')[0] for line in subprocess.run(
              ['nm', '-D', '--defined-only', str(library)], capture_output=True, text=True, check=True).stdout.splitlines()}
          bindings = pathlib.Path('lib/src/bindings/src/thermion_dart_ffi.g.dart').read_text()
          used = set(re.findall(r'^external\s+[^;=]*?\b(\w+)\(', bindings, re.MULTILINE))
          # Declared in c_api/*.h and in the bindings, but defined in no build
          # (default included) — pre-existing drift, unrelated to the opt-outs.
          never_defined = {
              'Camera_setProjectionMatrix', 'LightManager_rgbToColorTemperature',
              'RenderableManager_getCulling', 'RenderableManager_getPriority',
              'Renderer_setFrameInterval', 'Texture_getUsage',
          }
          missing = sorted(name for name in used if name not in exported and name not in never_defined)
          print(f'{len(used)} FFI entry points, {len(missing)} missing from the slim build', flush=True)
          if missing:
              raise SystemExit(f'FFI entry points missing from the slim build: {missing}')
          PYTHON

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-slim-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  runtime-materials-web:
    timeout-minutes: 15
    name: Runtime Materials (web, ${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: worker, enabled: true, variant: '', suffix: '-runtime-materials' }
          - { name: main-thread, enabled: true, variant: main_thread, suffix: '-main-thread-runtime-materials' }
          - { name: disabled, enabled: false, variant: '', suffix: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - uses: dart-lang/setup-dart@v1

      - name: Select web engine and disable unused native build
        run: |
          sed -i '/^hooks:/,$d' thermion_dart/pubspec.yaml
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                skip_native_build: true
                runtime_materials: ${{ matrix.enabled }}
                web_variant: '${{ matrix.variant }}'
                materials:
                  sharp_edge: true
          EOF

      - name: Download the committed web engine
        working-directory: thermion_dart
        env:
          ENGINE_SUFFIX: ${{ matrix.suffix }}
        run: |
          version="$(cat native/web/web.version)"
          curl -fL "https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev/thermion_dart-${version}-web${ENGINE_SUFFIX}.zip" \
            -o "$RUNNER_TEMP/runtime-materials-web.zip"
          unzip -o "$RUNNER_TEMP/runtime-materials-web.zip" -d test

      - name: Configure Chrome software rendering
        run: |
          chrome="$(command -v google-chrome)"
          printf '#!/bin/sh\nexec "%s" --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader "$@"\n' \
            "$chrome" > "$RUNNER_TEMP/thermion-test-chrome"
          chmod +x "$RUNNER_TEMP/thermion-test-chrome"
          echo "CHROME_EXECUTABLE=$RUNNER_TEMP/thermion-test-chrome" >> "$GITHUB_ENV"

      - name: Run web runtime material tests
        working-directory: thermion_dart
        run: |
          dart pub get
          xvfb-run dart run tool/web_test_runner.dart --assets=../examples/assets --clean \
            test/runtime_material_${{ matrix.enabled && 'enabled' || 'disabled' }}_test.dart \
            test/material_package_test.dart \
            test/embedded_material_loading_test.dart \
            ${{ matrix.enabled && 'test/runtime_material_metadata_test.dart test/runtime_material_diagnostics_test.dart' || '' }}

  webgpu-chrome-scene:
    timeout-minutes: 40
    name: Dart Tests (web, chrome, webgpu scene)
    # Linux Chromium's software compositor cannot present a WebGPU canvas
    # (the same constraint that keeps build-filament.yml's verify-webgpu-
    # engine job on macOS), so the browser half runs on a macOS runner with
    # real Chrome. The swiftshader wrapper flags below are kept from the
    # runtime-materials web jobs; they force software WebGPU when no GPU is
    # available and are harmless otherwise.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - uses: dart-lang/setup-dart@v1

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.4'
          actions-cache-folder: emsdk-cache

      - name: Download the Filament WebGPU web libraries
        run: |
          set -euo pipefail
          filament_libs="thermion_dart/native/web/lib/release"
          mkdir -p "$filament_libs"
          # Pin-aware URL ("web-webgpu/release" pin entry when present, else
          # the legacy -webgpu key). The archive carries emdawnwebgpu_pkg.
          curl -fL --retry 3 --retry-all-errors \
            "$(python3 scripts/filament-artifact-url.py web-webgpu release)" \
            -o "$RUNNER_TEMP/filament-web-webgpu.zip"
          unzip -o "$RUNNER_TEMP/filament-web-webgpu.zip" -d "$filament_libs"

      - name: Build the WebGPU engine from this branch
        run: |
          set -euo pipefail
          emcmake cmake -S thermion_dart/native/web -B thermion_dart/native/web/build-webgpu \
            -DCMAKE_BUILD_TYPE=Release -DTHERMION_ENABLE_WEBGPU=ON
          cmake --build thermion_dart/native/web/build-webgpu --parallel 3

      - name: Disable the unused native build
        working-directory: thermion_dart
        run: |
          # Mirror runtime-materials-web's pubspec rewrite: keep a materials:
          # map — web_test_runner's publishWebMaterials stages the flat test/
          # engine into test/embedded_engine/ and appends the built-in
          # material sections selected under materials: exactly once. The
          # scene renders with gltfio ubershaders, so the map is empty.
          sed -i '' '/^hooks:/,$d' pubspec.yaml
          cat >> pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                skip_native_build: true
                materials: {}
          EOF
          dart pub get

      - name: Copy the built engine flat into test/
        working-directory: thermion_dart
        run: |
          set -euo pipefail
          # Same flat layout the runtime-materials-web jobs unzip into test/:
          # web_test_runner stages test/ -> test/embedded_engine/ itself.
          cp native/web/build-webgpu/build/out/thermion_dart.js \
             native/web/build-webgpu/build/out/thermion_dart.wasm test/

      - name: Configure Chrome software rendering
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          printf '#!/bin/sh\nexec "%s" --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader --enable-unsafe-webgpu --use-webgpu-adapter=swiftshader "$@"\n' \
            "$chrome" > "$RUNNER_TEMP/thermion-test-chrome"
          chmod +x "$RUNNER_TEMP/thermion-test-chrome"
          echo "CHROME_EXECUTABLE=$RUNNER_TEMP/thermion-test-chrome" >> "$GITHUB_ENV"

      - name: Run the WebGPU chrome scene test
        working-directory: thermion_dart
        run: |
          # web_test_runner stamps the package:test HTML host wrapper and
          # runs the COOP/COEP proxy the pthreads engine needs, then invokes
          # `dart test test/chrome_webgpu_scene_test.dart -p chrome`.
          dart run tool/web_test_runner.dart --clean --timeout=300s \
            test/chrome_webgpu_scene_test.dart

  runtime-materials-ios:
    timeout-minutes: 30
    name: Runtime Materials (iOS simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Backport Flutter simulator log-readiness fix
        run: |
          # Flutter flutter/flutter#193142 fixes the CI startup race in #181771.
          # Apply only to this disposable SDK; remove once the pin includes it.
          git -C "$FLUTTER_ROOT" apply --check "$GITHUB_WORKSPACE/.github/patches/flutter-ios-log-readiness.patch"
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/.github/patches/flutter-ios-log-readiness.patch"
          # The action has already built the tool snapshot from unpatched sources.
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"

      - name: Test Flutter simulator log-readiness backport
        working-directory: ${{ env.FLUTTER_ROOT }}/packages/flutter_tools
        run: |
          "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" test test/general.shard/ios/simulators_test.dart --reporter expanded

      - name: Generate integration harness
        run: python3 scripts/create-runtime-materials-test-app.py --platform ios --destination "$RUNNER_TEMP/runtime-materials-app"
      - name: Boot an available iPhone simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')"
          xcrun simctl boot "$device_id" || xcrun simctl list devices booted | grep -F "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          echo "THERMION_SIMULATOR=$device_id" >> "$GITHUB_ENV"
      - name: Run the runtime material suite on iOS
        working-directory: ${{ runner.temp }}/runtime-materials-app
        # Include app install/launch and VM-service discovery in the log so a
        # stall after Xcode finishes can be located without guessing.
        run: flutter test --verbose --reporter expanded integration_test/runtime_materials_test.dart -d "$THERMION_SIMULATOR"

  runtime-materials-android:
    timeout-minutes: 30
    name: Runtime Materials (Android emulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Generate integration harness
        run: python3 scripts/create-runtime-materials-test-app.py --platform android --destination "$RUNNER_TEMP/runtime-materials-app"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ runner.temp }}/runtime-materials-app
          script: flutter test integration_test/runtime_materials_test.dart -d emulator-5554

  # Exercises the single-backend material variants (_opengl/_vulkan) that
  # materials.backends opts into. Each runner gets the backend it can
  # actually render with: Linux tests render through EGL/llvmpipe under xvfb
  # (like the Linux job above), Windows through SwiftShader Vulkan
  # (VK_ICD_FILENAMES). Android's android: [vulkan] variant is covered by an
  # appbundle build in flutter-tests-and-examples.yml.
  dart-tests-material-variants:
    name: Dart Tests Material Variants (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux opengl-only
            os: ubuntu-22.04
            os-key: linux
            backends: opengl
          - name: Windows vulkan-only
            os: windows-2022
            os-key: windows
            backends: vulkan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup build environment (Linux)
        if: matrix.os-key == 'linux'
        uses: ./.github/actions/setup-build-env

      - name: Install EGL libraries (Linux)
        if: matrix.os-key == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      - name: Setup build environment (Windows)
        if: matrix.os-key == 'windows'
        uses: ./.github/actions/setup-windows-env

      - name: Select material backend variant
        working-directory: thermion_dart
        shell: bash
        run: |
          dart pub get
          dart --packages=.dart_tool/package_config.json tool/configure_material_tests.dart "${{ matrix.os-key }}" "${{ matrix.backends }}"

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run material tests (Linux)
        if: matrix.os-key == 'linux'
        working-directory: thermion_dart
        run: |
          dart pub get
          xvfb-run dart test -j1 \
            test/image_tests.dart \
            test/overlay_tests.dart \
            test/wireframe_renderable_test.dart \
            test/normal_color_material_test.dart \
            test/sharp_edge_material_test.dart \
            test/gizmo_tests_new.dart \
            test/all_axes_test.dart \
            test/bone_picking_tests.dart \
            test/all_materials_smoke_test.dart \
            --concurrency=1

      - name: Run material tests (Windows)
        if: matrix.os-key == 'windows'
        working-directory: thermion_dart
        env:
          VK_ICD_FILENAMES: C:\swiftshader\vk_swiftshader_icd.json
        run: dart pub get; dart test -j1 test/image_tests.dart test/overlay_tests.dart test/wireframe_renderable_test.dart test/normal_color_material_test.dart test/sharp_edge_material_test.dart test/gizmo_tests_new.dart test/all_axes_test.dart test/all_materials_smoke_test.dart --concurrency=1

      - name: Upload material-variant test output candidate
        uses: actions/upload-artifact@v4
        with:
          name: dart-material-output-${{ matrix.name }}
          path: thermion_dart/test/output

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-variants-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  # Native WebGPU (Dawn) coverage on Linux. The `backend: webgpu` user
  # define (see the "Enable ... WebGPU backend" step below) makes the build
  # hook define THERMION_SUPPORTS_WEBGPU, link Dawn (the webgpu_dawn
  # monolith + abseil) and download the -webgpu suffixed Filament zip from
  # R2 instead of the canonical artifact (pinned under linux-webgpu/<variant>
  # once publish-filament-to-r2.yml records it). Dawn's Linux backend drives
  # Vulkan, so the job installs Mesa's lavapipe software rasterizer and
  # registers its ICD via VK_ICD_FILENAMES — the only "GPU" on a GitHub
  # runner. The tests render through headless swapchains, so unlike the
  # jobs above there is no display server to fake with xvfb.
  # webgpu_smoke_test.dart probes whether the engine actually has the
  # WebGPU driver and skips when it does not; the capture tests assume it,
  # which holds here because this job always builds it in.
  dart-tests-webgpu:
    name: Dart Tests (Linux WebGPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup build environment (Linux)
        uses: ./.github/actions/setup-build-env

      - name: Install libc++, EGL headers, Mesa lavapipe and X11 dev
        run: |
          sudo apt-get update -y
          # libc++/EGL match the Linux job above (the glue build needs both);
          # libvulkan1 + mesa-vulkan-drivers provide the loader and lavapipe,
          # the software Vulkan device Dawn renders through.
          # libx11-dev + libxcb1-dev: the -webgpu Filament archives build
          # Dawn/Filament's WebGPU backend with X11 surface support (only
          # the host tools disable DAWN_USE_X11), so libbackend.a references
          # XGetWindowAttributes and the libthermion_dart.so link line adds
          # -lX11 (see hook/build.dart). That needs the libX11.so symlink
          # from libx11-dev; libxcb1-dev provides the xcb headers the X11
          # stack builds against.
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev \
            libvulkan1 mesa-vulkan-drivers libx11-dev libxcb1-dev
          # Register the lavapipe ICD explicitly instead of relying on the
          # loader's default scan, and fail here (not mid-test) if apt
          # moves it.
          lvp_icd=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          test -f "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"

      - name: Enable debug mode and WebGPU backend for tests
        working-directory: thermion_dart
        run: |
          dart pub get
          dart --packages=.dart_tool/package_config.json tool/configure_material_tests.dart
          # `backend: webgpu` selects the _webgpu material variant, defines
          # THERMION_SUPPORTS_WEBGPU and switches the artifact download to
          # the -webgpu zip (hook/build.dart detects it before getLibDir).
          sed -i 's/^    thermion_dart:$/    thermion_dart:\n      backend: webgpu/' pubspec.yaml
          grep -n -A4 'user_defines' pubspec.yaml

      - name: Clean cached Filament libraries
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run WebGPU smoke and capture tests (Linux)
        working-directory: thermion_dart
        run: |
          dart pub get
          dart test -j1 \
            test/webgpu_smoke_test.dart \
            test/capture_tests_webgpu.dart \
            --concurrency=1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-Linux-WebGPU
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  compare-dart-test-output:
    name: Compare Dart Test Output (${{ matrix.name }})
    needs:
      - dart-tests
      - dart-tests-macos
      - dart-tests-material-variants
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            artifact: dart-test-output-Linux
            baseline_asset: dart-test-output-Linux.zip
            baseline_sha256: 57fc5338ae362018f3fe78bd708324578c8d4f87fcd482e13d60e3d471b23101
          - name: Windows
            artifact: dart-test-output-Windows
            baseline_asset: dart-test-output-Windows.zip
            baseline_sha256: 0b55d61c4d8fc7b7965a07e41db431134dc2b22917d6a00107596a7d41db53be
          - name: macOS
            artifact: dart-test-output-macOS
            baseline_asset: dart-test-output-macOS.zip
            baseline_sha256: 0445323beac95378a0c6725d08743f61587e99ac7cd831cc3706801a371c8511
          - name: Linux opengl-only
            artifact: dart-material-output-Linux opengl-only
            baseline_asset: dart-material-output-Linux-opengl-only.zip
            baseline_sha256: a903567d420f6de5587c7827982db82146a583e3ac30cbf106ed2d3641ea8aea
          - name: Windows vulkan-only
            artifact: dart-material-output-Windows vulkan-only
            baseline_asset: dart-material-output-Windows-vulkan-only.zip
            baseline_sha256: 89b9bb01cc864b838b7ed12307c11715c1b112dc1da50220c85b62d958e17533
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Download current test output
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: thermion_dart/test/golden-candidate

      - name: Download reviewed platform baseline
        env:
          # Reviewed PNGs live on Cloudflare R2 under render-baselines/<id>/.
          # Review captures, then run scripts/update_goldens.sh --run <run-id>
          # with the approved PNG paths. Add --publish to upload and advance
          # these pins. Each version records its provenance in baseline-review.json.
          BASELINE_BASE_URL: https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev/render-baselines
          BASELINE_ID: run-45595627737-e3326f9e4922e943a820
          BASELINE_ASSET: ${{ matrix.baseline_asset }}
          BASELINE_SHA256: ${{ matrix.baseline_sha256 }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/thermion-golden-baseline"
          mkdir -p "$baseline_dir"
          curl -fL "${BASELINE_BASE_URL}/${BASELINE_ID}/${BASELINE_ASSET}" \
            -o "$baseline_dir/$BASELINE_ASSET"
          printf '%s  %s\n' "$BASELINE_SHA256" "$baseline_dir/$BASELINE_ASSET" | sha256sum --check --strict
          python -m zipfile -e "$baseline_dir/$BASELINE_ASSET" thermion_dart/test/golden-baseline

      - name: Install golden comparison dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy

      - name: Compare all captured test output
        run: >-
          python thermion_dart/test/compare_goldens.py
          --golden-dir thermion_dart/test/golden-baseline
          --output-dir thermion_dart/test/golden-candidate
