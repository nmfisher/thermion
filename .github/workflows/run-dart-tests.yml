name: Windows morph lighting diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows-env
      - run: python scripts/probe_morph_fixture.py
      - working-directory: thermion_dart
        run: |
          dart pub get
          dart --packages=.dart_tool/package_config.json tool/configure_material_tests.dart
      - name: Compare target configurations and morph inputs across processes
        working-directory: thermion_dart
        env:
          VK_ICD_FILENAMES: C:\swiftshader\vk_swiftshader_icd.json
        run: |
          foreach ($trial in 0..3) {
            $env:MORPH_TRIAL = "$trial"
            dart test -j1 -r expanded test/morph_diagnosis_test.dart
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-morph-captures
          path: thermion_dart/test/output/morph-diagnosis/
