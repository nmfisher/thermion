name: Dart Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

jobs:
  dart-tests:
    name: Dart Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('thermion_dart/pubspec.lock', 'thermion_dart/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup build environment (Linux)
        if: matrix.name == 'Linux'
        uses: ./.github/actions/setup-build-env

      - name: Install EGL libraries (Linux)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libegl1-mesa-dev libc++-dev libc++abi-dev

      - name: Setup build environment (Windows)
        if: matrix.name == 'Windows'
        uses: ./.github/actions/setup-windows-env

      - name: Enable debug mode for tests
        shell: bash
        run: |
          echo 'hooks:' >> thermion_dart/pubspec.yaml
          echo '  user_defines:' >> thermion_dart/pubspec.yaml
          echo '    thermion_dart:' >> thermion_dart/pubspec.yaml
          echo '      mode: debug' >> thermion_dart/pubspec.yaml

      - name: Clean cached Filament libraries
        shell: bash
        run: rm -rf thermion_dart/.dart_tool/thermion_dart/lib

      - name: Run tests (Linux)
        if: matrix.name == 'Linux'
        working-directory: thermion_dart
        run: |
          dart pub get
          xvfb-run dart test -j1 \
            test/asset_tests.dart \
            test/instancing_tests.dart \
            test/light_tests.dart \
            test/entity_tests.dart \
            test/geometry_tests.dart \
            test/view_tests.dart \
            test/postprocessing_tests.dart \
            test/scene_tests.dart \
            test/picking_tests.dart \
            test/image_tests.dart \
            test/animation_tests.dart \
            test/renderable_manager_tests.dart \
            test/gltf_parser_tests.dart \
            --concurrency=1

      - name: Run tests (Windows)
        if: matrix.name == 'Windows'
        working-directory: thermion_dart
        env:
          VK_ICD_FILENAMES: C:\swiftshader\vk_swiftshader_icd.json
        run: |
          dart pub get
          dart test -j1 `
            test/asset_tests.dart `
            test/instancing_tests.dart `
            test/light_tests.dart `
            test/entity_tests.dart `
            test/geometry_tests.dart `
            test/view_tests.dart `
            test/postprocessing_tests.dart `
            test/scene_tests.dart `
            test/picking_tests.dart `
            test/image_tests.dart `
            --concurrency=1

      - name: Zip output
        if: matrix.name == 'Linux'
        run: zip -r output.zip ./thermion_dart/test/output

      - name: Upload test output
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: golden-images-${{ github.sha }}
          path: output.zip

      - name: Download golden images from previous run
        if: matrix.name == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 24704021820 \
            --name golden-images-cb130f7df034a15372616ba73e689e26f8f9a7e8  \
            --dir ./thermion_dart/test/golden-downloads

      - name: Unzip golden images
        if: matrix.name == 'Linux'
        run: |
          cd thermion_dart/test/golden-downloads && unzip output.zip

      - name: Install Python dependencies
        if: matrix.name == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Compare golden images
        if: matrix.name == 'Linux'
        run: cd thermion_dart/test && python compare_goldens.py

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-dart-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5
