name: Filament cache layout tests

on:
  pull_request:
    paths:
      - 'thermion_dart/hook/build.dart'
      - 'thermion_dart/test/filament_cache_layout_test.dart'
      - '.github/workflows/filament-cache-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'thermion_dart/hook/build.dart'
      - 'thermion_dart/test/filament_cache_layout_test.dart'
      - '.github/workflows/filament-cache-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Skip unused native build
        run: |
          cat >> thermion_dart/pubspec.yaml <<'EOF'
          hooks:
            user_defines:
              thermion_dart:
                skip_native_build: true
          EOF
      - name: Test pinned and legacy Android cache layouts
        working-directory: thermion_dart
        run: |
          dart pub get
          dart test test/filament_cache_layout_test.dart --reporter expanded
