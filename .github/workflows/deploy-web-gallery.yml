name: Deploy Web Gallery

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

# Builds the Thermion examples web gallery (one WASM build, ?example= router)
# and deploys it to Cloudflare Pages. Cloudflare Pages is required because the
# multithreaded WASM needs COOP/COEP headers (web/_headers) for SharedArrayBuffer,
# which GitHub Pages and docs.page cannot set. The deployed URL is loaded on
# demand by the documentation site's ThermionExample component.
#
# One-time manual setup (documented in the PR):
#   1. Create a Cloudflare Pages project named `thermion-examples`.
#   2. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   3. (Optional) Bind a custom domain (e.g. examples.thermion.dev).
permissions:
  contents: read

concurrency:
  group: deploy-web-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Gallery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Resolve thermion_dart dependencies
        working-directory: thermion_dart
        run: dart pub get

      - name: Resolve examples_lib dependencies
        working-directory: examples/dart/examples_lib
        run: dart pub get

      - name: Resolve web_gallery dependencies
        working-directory: examples/dart/web_gallery
        run: dart pub get

      - name: Download thermion web artifacts (thermion_dart.js/wasm)
        working-directory: thermion_dart
        run: dart run bin/download_web.dart -o ../examples/dart/web_gallery/web

      - name: Copy shared assets
        run: cp -r examples/assets examples/dart/web_gallery/web/assets

      - name: Compile gallery to WASM
        working-directory: examples/dart/web_gallery
        run: dart compile wasm web/main.dart -o web/main.wasm

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy examples/dart/web_gallery/web --project-name=thermion-examples
