name: Build WebGPU engine

on:
  workflow_call:
    inputs:
      filament_version:
        required: true
        type: string
      filament_run:
        required: false
        type: string
      publish:
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      FILAMENT_VERSION: ${{ inputs.filament_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: filament-web-release-webgpu
          path: filament-webgpu
          run-id: ${{ inputs.filament_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.4'
          actions-cache-folder: emsdk-cache

      - name: Install libraries and build the engine
        run: |
          set -euo pipefail
          web=thermion_dart/native/web
          mkdir -p "$web/lib/release"
          unzip -q "filament-webgpu/filament-$FILAMENT_VERSION-web-release-webgpu.zip" -d "$web/lib/release"
          emcmake cmake -S "$web" -B "$web/build-webgpu" -DCMAKE_BUILD_TYPE=Release \
            -DTHERMION_ENABLE_WEBGPU=ON
          cmake --build "$web/build-webgpu" --parallel 2

      - name: Package engine archive
        id: package
        run: |
          set -euo pipefail
          web=thermion_dart/native/web
          version=$(cat "$web/web.version")
          # Reuse the public version when only the pointer or unrelated files
          # changed after its build. A candidate gets its own commit ID.
          if ! git cat-file -e "$version^{commit}" 2>/dev/null || \
             ! git diff --quiet "$version" -- filament.version thermion_dart/filament.libs.json \
                  thermion_dart/native thermion_dart/lib/src/bindings ":(exclude)$web/web.version"; then
            version=$(git rev-parse --short HEAD)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p webgpu-engines
          engine_dir="$web/build-webgpu/build/out"
          zip -j "webgpu-engines/thermion_dart-$version-web-webgpu.zip" \
            "$engine_dir/thermion_dart.js" "$engine_dir/thermion_dart.wasm"

      - uses: actions/upload-artifact@v4
        with:
          name: thermion-webgpu-engines
          path: webgpu-engines/

  chromium:
    name: Verify and publish the WebGPU engine
    needs: engine
    # Linux Chromium's software compositor cannot present the WebGPU canvas.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      WEB_ENGINE_VERSION: ${{ needs.engine.outputs.version }}
      R2_PUBLIC_URL: https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev
      CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thermion-webgpu-engines
          path: webgpu-engines
      - uses: dart-lang/setup-dart@v1

      - name: Compile the browser scene
        working-directory: thermion_dart
        run: |
          dart pub get
          mkdir -p "$RUNNER_TEMP/webgpu-scene"
          dart compile js test/chrome_webgpu_scene.dart -o "$RUNNER_TEMP/webgpu-scene/app.js"

      - name: Render a WebGPU scene from the staged archive
        run: |
          unzip -o "webgpu-engines/thermion_dart-$WEB_ENGINE_VERSION-web-webgpu.zip" -d "$RUNNER_TEMP/webgpu-scene"
          python3 scripts/check-webgpu-canvas.py "$RUNNER_TEMP/webgpu-scene" --chrome "$CHROME_EXECUTABLE"

      - name: Publish and verify the public archives
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://260d4efc65af500536ea376de6452ece.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Both WebGPU selectors use the same main-thread engine.
          archive="webgpu-engines/thermion_dart-$WEB_ENGINE_VERSION-web-webgpu.zip"
          for suffix in webgpu main-thread-webgpu; do
            artifact="thermion_dart-$WEB_ENGINE_VERSION-web-$suffix.zip"
            aws s3 cp "$archive" "s3://thermion/$artifact" --endpoint-url "$R2_ENDPOINT"
            curl -fL --retry 3 "$R2_PUBLIC_URL/$artifact" -o "$RUNNER_TEMP/published-webgpu.zip"
            cmp "$archive" "$RUNNER_TEMP/published-webgpu.zip"
          done

      - name: Render from the published R2 archive
        if: inputs.publish
        run: |
          curl -fL --retry 3 "$R2_PUBLIC_URL/thermion_dart-$WEB_ENGINE_VERSION-web-webgpu.zip" \
            -o "$RUNNER_TEMP/published-webgpu.zip"
          unzip -o "$RUNNER_TEMP/published-webgpu.zip" -d "$RUNNER_TEMP/webgpu-scene"
          python3 scripts/check-webgpu-canvas.py "$RUNNER_TEMP/webgpu-scene" --chrome "$CHROME_EXECUTABLE"
