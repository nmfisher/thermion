name: Format

on:
  pull_request:
  push:
    branches: [ develop ]

# Same list of paths the old Lint format-check covered.
# Note: master is branch-protected (requires a PR), so master-bound code is
# formatted here at PR time instead. develop is unprotected, so the bot can
# commit formatting fixes directly on push.
permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format and commit
    runs-on: ubuntu-22.04
    # Skip fork PRs: the default GITHUB_TOKEN cannot push back to them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the actual PR head (not the ephemeral merge commit) so we
          # can push back to the source branch. Falls back to the pushed ref.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-format-${{ hashFiles('thermion_dart/pubspec.yaml') }}
          restore-keys: pub-format-

      - name: Format
        run: |
          dart format \
            thermion_dart/lib \
            thermion_dart/bin \
            thermion_dart/hook \
            thermion_dart/tool \
            thermion_dart/test \
            thermion_flutter/thermion_flutter/lib

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -am "chore: format (CI)

          🤖 Generated with GitHub Actions"
          git push
