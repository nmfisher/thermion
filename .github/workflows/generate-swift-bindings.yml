name: Generate Swift Bindings

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'thermion_flutter/thermion_flutter/darwin/include/generated/SwiftThermionFlutterPluginObjCAPI.h'
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'thermion_flutter/thermion_flutter/darwin/include/generated/SwiftThermionFlutterPluginObjCAPI.h'
  workflow_dispatch:
  # Called by publish-pub-dev.yml on a v* tag push, with verify: true. Note:
  # paths filters do not apply to workflow_call, so a release call always
  # regenerates Swift bindings unconditionally ("always on release").
  workflow_call:
    inputs:
      verify:
        description: 'If true, regenerate as a gate and fail on any uncommitted diff instead of committing/pushing. Used by the release flow.'
        required: false
        type: boolean
        default: false

concurrency:
  group: generate-swift-bindings-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate-swift-bindings:
    name: Generate Swift Bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-flutter-${{ runner.os }}-${{ hashFiles('thermion_flutter/thermion_flutter/pubspec.lock', 'thermion_flutter/thermion_flutter/pubspec.yaml') }}
          restore-keys: |
            pub-flutter-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          architecture: X64

      - name: Generate Swift bindings
        run: make flutter-bindings

      - name: Format generated Swift bindings
        run: dart format thermion_flutter/thermion_flutter/lib/src/swift/swift_bindings.g.dart

      - name: Ensure generated binding file is tracked
        run: git update-index --no-assume-unchanged thermion_flutter/thermion_flutter/lib/src/swift/swift_bindings.g.dart

      - name: Check for changes
        id: git-check
        run: git diff --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      # Release gate (called with verify: true): the tag must already contain
      # committed Swift bindings. A diff means they are stale — abort release.
      - name: Fail if swift bindings are stale (verify)
        if: ${{ inputs.verify && steps.git-check.outputs.changed == 'true' }}
        run: |
          echo "::error::Generated swift bindings differ from the committed tag. Run 'make flutter-bindings', commit on develop, then re-tag."
          git --no-pager diff --stat
          exit 1

      - name: Commit and push if changed
        if: ${{ !inputs.verify && steps.git-check.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f thermion_flutter/thermion_flutter/lib/src/swift/swift_bindings.g.dart
          git commit -m "chore: update generated swift bindings

          🤖 Generated with GitHub Actions"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
