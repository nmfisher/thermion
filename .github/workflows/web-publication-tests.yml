name: Web publication tests

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/regenerate-bindings-and-materials.yml'
      - '.github/workflows/web-publication-tests.yml'
      - 'scripts/test_web_publication.py'
  pull_request:
    paths:
      - '.github/workflows/regenerate-bindings-and-materials.yml'
      - '.github/workflows/web-publication-tests.yml'
      - 'scripts/test_web_publication.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_web_publication.py' -v
