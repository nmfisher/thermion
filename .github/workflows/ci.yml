name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate-artifacts:
    name: Generate Artifacts
    runs-on: macos-latest
    outputs:
      should-run: ${{ steps.changes.outputs.source-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Get one commit back for comparison

      - name: Check for source changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            source-changed:
              - 'thermion_dart/ffigen/**'
              - 'thermion_dart/lib/src/bindings/**'
              - 'thermion_dart/native/**'
              - 'thermion_flutter/windows/**'
              - 'thermion_flutter/darwin/**'
              - 'thermion_flutter/android/**'

      - name: Setup CMake
        if: steps.changes.outputs.source-changed == 'true'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.0'

      - name: Setup Emscripten
        if: steps.changes.outputs.source-changed == 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Set up Flutter
        if: steps.changes.outputs.source-changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: master
          architecture: X64

      - name: Run ffigen
        if: steps.changes.outputs.source-changed == 'true'
        working-directory: thermion_dart
        run: dart run ffigen --config ffigen/native.yaml

      - name: Run ffigen_js
        if: steps.changes.outputs.source-changed == 'true'
        working-directory: thermion_dart
        run: dart run ffigen_js --config ffigen/web.yaml

      - name: Compile web
        if: steps.changes.outputs.source-changed == 'true'
        run: make wasm

      - name: Ensure generated files are tracked
        if: steps.changes.outputs.source-changed == 'true'
        run: |
          git update-index --no-assume-unchanged thermion_dart/lib/src/bindings/src/thermion_dart_ffi.g.dart
          git update-index --no-assume-unchanged thermion_dart/lib/src/bindings/src/thermion_dart_js_interop.g.dart
          git update-index --no-assume-unchanged thermion_dart/native/web/build/build/out/thermion_dart.js
          git update-index --no-assume-unchanged thermion_dart/native/web/build/build/out/thermion_dart.wasm
          git update-index --no-assume-unchanged thermion_flutter/thermion_flutter/lib/src/swift/swift_bindings.g.dart

      - name: Check for changes
        id: git-check
        if: steps.changes.outputs.source-changed == 'true'
        run: |
          git diff --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f thermion_dart/lib/src/bindings/src/thermion_dart_ffi.g.dart
          git add -f thermion_dart/lib/src/bindings/src/thermion_dart_js_interop.g.dart
          git add -f thermion_dart/native/web/build/build/out/thermion_dart.js
          git add -f thermion_dart/native/web/build/build/out/thermion_dart.wasm
          git add -f thermion_flutter/thermion_flutter/lib/src/swift/swift_bindings.g.dart
          git commit -m "chore: update generated artifacts

          🤖 Generated with GitHub Actions"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload artifacts
        if: steps.changes.outputs.source-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm-${{ github.sha }}
          path: thermion_dart/native/web/build/build/out/

  dart-tests:
    name: Dart Tests
    runs-on: ubuntu-22.04
    # Run even if generate-artifacts was skipped
    if: always() && (needs.generate-artifacts.result == 'success' || needs.generate-artifacts.result == 'skipped')
    needs: generate-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
      - name: Enable debug mode for tests
        run: |
          echo 'hooks:' >> thermion_dart/pubspec.yaml
          echo '  user_defines:' >> thermion_dart/pubspec.yaml
          echo '    thermion_dart:' >> thermion_dart/pubspec.yaml
          echo '      mode: debug' >> thermion_dart/pubspec.yaml
      - run: |
          cd thermion_dart
          dart pub get
          xvfb-run dart test -j1 \
            test/asset_tests.dart \
            test/instancing_tests.dart \
            test/light_tests.dart \
            test/entity_tests.dart \
            test/geometry_tests.dart \
            test/view_tests.dart \
            test/postprocessing_tests.dart \
            test/scene_tests.dart  \
            test/picking_tests.dart \
            test/image_tests.dart \
            --concurrency=1
      - name: Zip output
        run: zip -r output.zip ./thermion_dart/test/output
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: golden-images-${{ github.sha }}
          path: output.zip
      - name: Download golden images from previous run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Helper: find the most recent successful run with golden-images artifacts
          find_golden_run() {
            local repo="$1"
            gh api \
              "repos/${repo}/actions/workflows/ci.yml/runs?branch=develop&status=success&per_page=20" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | .[].id" \
            | while read -r run_id; do
                HAS_GOLDEN=$(gh api \
                  "repos/${repo}/actions/runs/${run_id}/artifacts" \
                  --jq '[.artifacts[] | select(.name | startswith("golden-images-")) | select(.expired == false)] | length')
                if [ "$HAS_GOLDEN" -gt 0 ]; then
                  echo "$run_id"
                  break
                fi
              done
          }

          CURRENT_REPO="${{ github.repository }}"
          SOURCE_REPO=""
          PREV_RUN_ID=""

          # 1) Check this repo for a successful run with golden images
          echo "Searching ${CURRENT_REPO} for golden image baseline..."
          PREV_RUN_ID=$(find_golden_run "$CURRENT_REPO")

          # 2) If not found and this is a fork, check the parent repo
          if [ -z "$PREV_RUN_ID" ]; then
            PARENT_REPO=$(gh api "repos/${CURRENT_REPO}" --jq '.parent.full_name // empty')
            if [ -n "$PARENT_REPO" ]; then
              echo "No baseline in fork. Searching upstream ${PARENT_REPO}..."
              PREV_RUN_ID=$(find_golden_run "$PARENT_REPO")
              SOURCE_REPO="$PARENT_REPO"
            fi
          fi

          if [ -z "$PREV_RUN_ID" ]; then
            echo "::error::No golden image baseline found in ${CURRENT_REPO} or its upstream."
            echo "::error::Looked for successful CI runs with golden-images-* artifacts."
            echo "::error::This can happen when all artifacts have expired or no"
            echo "::error::successful run has been recorded yet."
            exit 1
          fi

          DOWNLOAD_REPO="${SOURCE_REPO:-$CURRENT_REPO}"
          echo "Downloading golden images from ${DOWNLOAD_REPO} run ${PREV_RUN_ID}"
          gh run download "$PREV_RUN_ID" \
            --repo "$DOWNLOAD_REPO" \
            --pattern 'golden-images-*' \
            --dir ./thermion_dart/test/golden-downloads
      - name: Unzip golden images
        run: |
          cd thermion_dart/test/golden-downloads && unzip output.zip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy
      - name: Compare golden images
        run: cd thermion_dart/test && python compare_goldens.py
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  flutter-examples:
    name: Flutter Examples
    runs-on: macos-latest
    # Run only if dart-tests succeeded (not if generate-artifacts was skipped)
    if: always() && needs.dart-tests.result == 'success'
    needs: [generate-artifacts, dart-tests]
    defaults:
      run:
        working-directory: examples/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          architecture: ARM64
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cmake-version: 3.22.1
          ndk-version: 25.1.893739
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
      - run: cd quickstart && flutter pub get && flutter build macos
      - run: cd quickstart && flutter pub get && flutter build appbundle
      - run: cd quickstart && flutter build web
      - run: cd picking && flutter pub get && flutter build macos
      - run: cd picking && flutter pub get && flutter build appbundle
      - run: cd picking && flutter build web
      - run: cd viewer && flutter pub get && flutter build appbundle
      - run: cd viewer && flutter build web
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /Users/runner/work/thermion/thermion/thermion_dart/.dart_tool/thermion_dart/log/build.log
          retention-days: 5

  flutter-examples-windows:
    name: Flutter Examples (Windows)
    runs-on: windows-latest
    # Run only if flutter-examples succeeded
    if: success() && needs.flutter-examples.result == 'success'
    needs: flutter-examples
    defaults:
      run:
        working-directory: examples/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
      - run: cd quickstart && flutter pub get && flutter build windows
      - run: cd picking && flutter pub get && flutter build windows
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            D:\a\thermion\thermion\thermion_dart\.dart_tool\thermion_dart\log\build.log
          retention-days: 5
