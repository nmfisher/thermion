name: Native Scheduling

on:
  pull_request:
    paths:
      - 'thermion_dart/native/include/rendering/**'
      - 'thermion_dart/native/include/Log.hpp'
      - 'thermion_dart/native/src/rendering/**'
      - 'thermion_dart/native/test/rendering/**'
      - '.github/workflows/native-scheduling.yml'
  push:
    branches: [develop]
    paths:
      - 'thermion_dart/native/include/rendering/**'
      - 'thermion_dart/native/include/Log.hpp'
      - 'thermion_dart/native/src/rendering/**'
      - 'thermion_dart/native/test/rendering/**'
      - '.github/workflows/native-scheduling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone scheduling tests
        run: cmake -S thermion_dart/native/test/rendering -B build/scheduling
      - name: Build
        run: cmake --build build/scheduling --config Release
      - name: Test
        run: ctest --test-dir build/scheduling -C Release --output-on-failure
