name: Dart/Flutter Tests and Example Apps

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (SHA or branch) to check out
        required: false
        type: string

jobs:
  dart-tests:
    uses: ./.github/workflows/run-dart-tests.yml
    with:
      ref: ${{ inputs.ref }}

  # Same shape as dart-tests, but with the assimp user_define enabled and
  # only the model-import tests (see run-assimp-tests.yml).
  assimp-tests:
    uses: ./.github/workflows/run-assimp-tests.yml
    with:
      ref: ${{ inputs.ref }}

  flutter-builds:
    uses: ./.github/workflows/run-flutter-builds.yml
    with:
      ref: ${{ inputs.ref }}
